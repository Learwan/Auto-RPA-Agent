[project]
name = "auto-agent-workflow"
version = "0.1.0"
description = "Cross-platform automated agent workflow system for desktop operation recording, analysis, and execution"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "pynput>=1.7.7",
    "pyautogui>=0.9.54",
    "mss>=10.0.0",
    "psutil>=6.1.0",
    "watchdog>=6.0.0",
    "typer>=0.15.0",
    "pillow>=11.0.0",
    "rich>=13.9.0",
    "httpx>=0.28.0",
    "openai>=1.60.0",
    "pyperclip>=1.9.0",
    "alembic>=1.14.0",
]

[project.optional-dependencies]
macos = ["pyobjc-framework-Quartz>=10.3", "pyobjc-framework-ApplicationServices>=10.3", "pyobjc-framework-Cocoa>=10.3"]
windows = ["comtypes>=1.4.0"]
web = ["playwright>=1.52.0"]
ocr = ["rapidocr-onnxruntime>=1.4.0"]
local-llm = [
    "mlx>=0.31.2",
    "mlx-lm>=0.31.3",
    "mlx-vlm>=0.5.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "av>=17.0.1",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "mypy>=1.13.0",
    "numpy>=2.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
auto-agent = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
