<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Editor — Auto Agent Workflow</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
if (typeof Babel === 'undefined') {
  document.write('<script crossorigin src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"><\/script>');
}
</script>
<link rel="stylesheet" href="https://unpkg.com/reactflow@11/dist/style.css">
<script crossorigin src="https://unpkg.com/reactflow@11/dist/umd/index.js"></script>
<style>
:root {
  --bg-deep: #faf9f7;
  --bg-panel: #f0efe9;
  --bg-elevated: #ffffff;
  --bg-input: #ffffff;
  --border: #e8e7e3;
  --border-active: #d4d3cf;
  --text-dim: #9b9b9b;
  --text-body: #6b6b6b;
  --text-bright: #1a1a1a;
  --text-white: #111111;
  --accent-cyan: #0891b2;
  --accent-green: #16a34a;
  --accent-red: #dc2626;
  --accent-amber: #d97706;
  --accent-blue: #3b82f6;
  --accent-purple: #7c3aed;
  --accent-pink: #db2777;
  --accent-teal: #0d9488;
  --radius-sm: 4px;
  --radius: 8px;
  --radius-lg: 12px;
  --font-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-deep);
  color: var(--text-body);
  font-family: var(--font-body);
  font-size: 13px;
  line-height: 1.5;
  height: 100vh;
  overflow: hidden;
}

#root { height: 100vh; width: 100vw; }

.loading-screen {
  display: flex; align-items: center; justify-content: center;
  height: 100vh; width: 100vw;
  background: var(--bg-deep);
  flex-direction: column; gap: 20px;
}

.loading-screen .spinner {
  width: 36px; height: 36px;
  border: 2px solid var(--border);
  border-top-color: var(--accent-cyan);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-screen .text {
  color: var(--text-dim);
  font-size: 13px;
}

.app-container {
  display: flex; flex-direction: column;
  height: 100vh; width: 100vw;
}

.toolbar {
  height: 44px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 12px;
  gap: 8px;
  flex-shrink: 0;
  z-index: 20;
}

.toolbar-group {
  display: flex; align-items: center; gap: 4px;
}

.toolbar-divider {
  width: 1px; height: 20px;
  background: var(--border);
  margin: 0 4px;
}

.toolbar-title {
  font-weight: 600;
  color: var(--accent-cyan);
  font-size: 13px;
  letter-spacing: 0.5px;
  margin-right: 8px;
}

.toolbar-flow-name {
  color: var(--text-bright);
  font-size: 13px;
  font-weight: 500;
  min-width: 120px;
  max-width: 300px;
  overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap;
  border: 1px solid transparent;
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  cursor: text;
  background: transparent;
  transition: all 0.15s;
}

.toolbar-flow-name:hover {
  border-color: var(--border);
  background: var(--bg-input);
}

.toolbar-flow-name:focus {
  border-color: var(--accent-cyan);
  background: var(--bg-input);
  outline: none;
}

.toolbar-spacer { flex: 1; }

.btn {
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  color: var(--text-bright);
  cursor: pointer;
  transition: all 0.12s;
  display: flex; align-items: center; gap: 4px;
  white-space: nowrap;
}

.btn:hover { border-color: var(--border-active); background: #f5f4f1; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-primary {
  background: var(--accent-amber);
  border-color: var(--accent-amber);
  color: #ffffff;
  font-weight: 600;
}
.btn-primary:hover { background: #c5660a; }

.btn-green {
  background: var(--accent-green);
  border-color: var(--accent-green);
  color: #ffffff;
  font-weight: 600;
}
.btn-green:hover { background: #15803d; }

.btn-red {
  border-color: var(--accent-red); color: var(--accent-red);
}
.btn-red:hover { background: rgba(240,75,92,0.12); }

.btn-sm { padding: 3px 8px; font-size: 11px; }

.btn-icon {
  width: 30px; height: 30px;
  padding: 0; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
}

.workspace {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

.node-library {
  width: 220px;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  flex-shrink: 0;
  z-index: 10;
}

.library-header {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 12px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  display: flex; align-items: center; justify-content: space-between;
}

.library-search {
  margin: 8px 12px;
}

.library-search input {
  width: 100%;
  padding: 6px 10px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-bright);
  font-size: 12px;
  outline: none;
  font-family: inherit;
}

.library-search input:focus {
  border-color: var(--accent-cyan);
}

.library-search input::placeholder { color: var(--text-dim); }

.library-list {
  flex: 1; overflow-y: auto; padding: 8px;
}

.library-list::-webkit-scrollbar { width: 4px; }
.library-list::-webkit-scrollbar-track { background: transparent; }
.library-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.library-category {
  margin-bottom: 12px;
}

.library-category-title {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 4px 8px;
  margin-bottom: 4px;
}

.library-node {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  cursor: grab;
  transition: all 0.12s;
  border: 1px solid transparent;
  font-size: 12px;
  color: var(--text-body);
  user-select: none;
}

.library-node:hover {
  background: var(--bg-elevated);
  border-color: var(--border);
  color: var(--text-bright);
}

.library-node:active { cursor: grabbing; }

.library-node-dot {
  width: 8px; height: 8px;
  border-radius: 2px;
  flex-shrink: 0;
}

.canvas-area {
  flex: 1;
  position: relative;
}

.property-panel {
  width: 300px;
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  flex-shrink: 0;
  z-index: 10;
}

.property-header {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 12px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.property-body {
  flex: 1; overflow-y: auto; padding: 12px;
}

.property-body::-webkit-scrollbar { width: 4px; }
.property-body::-webkit-scrollbar-track { background: transparent; }
.property-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.property-group {
  margin-bottom: 16px;
}

.property-group-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.property-field {
  margin-bottom: 10px;
}

.property-field label {
  display: block;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
}

.property-field input,
.property-field select,
.property-field textarea {
  width: 100%;
  padding: 6px 8px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-bright);
  font-size: 12px;
  font-family: inherit;
  outline: none;
}

.property-field input:focus,
.property-field select:focus,
.property-field textarea:focus {
  border-color: var(--accent-cyan);
}

.property-field textarea {
  resize: vertical;
  min-height: 60px;
}

.property-field select {
  cursor: pointer;
}

.property-field-check {
  display: flex; align-items: center; gap: 8px;
}

.property-field-check input[type="checkbox"] {
  width: auto;
  accent-color: var(--accent-cyan);
}

.property-empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 20px;
  color: var(--text-dim);
  text-align: center;
  gap: 8px;
  flex: 1;
}

.property-empty-icon {
  font-size: 28px;
  opacity: 0.3;
}

.react-flow__node {
  font-family: var(--font-mono);
}

.react-flow__attribution { display: none !important; }

.react-flow__controls {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.react-flow__controls-button {
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  fill: var(--text-bright);
  width: 28px; height: 28px;
}

.react-flow__controls-button:hover {
  background: #f5f4f1;
}

.react-flow__minimap {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.edge-label {
  font-size: 10px;
  font-family: var(--font-mono);
  fill: var(--text-dim);
}

.toast-container {
  position: fixed; bottom: 20px; right: 20px;
  z-index: 1000;
  display: flex; flex-direction: column-reverse; gap: 8px;
}

.toast {
  padding: 10px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  color: var(--text-bright);
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  animation: toastIn 0.25s ease-out;
  max-width: 380px;
}

.toast-success { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
.toast-error { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
.toast-info { background: #eff6ff; border: 1px solid #93c5fd; color: #1e40af; }

@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes toastOut {
  from { opacity: 1; transform: translateX(0); }
  to { opacity: 0; transform: translateX(20px); }
}

.toast-exit {
  animation: toastOut 0.2s ease-in forwards;
}

.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.15);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}

.modal {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  min-width: 400px;
  max-width: 600px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.08);
  max-height: 80vh;
  overflow-y: auto;
}

.modal h3 {
  color: var(--text-white);
  font-size: 15px;
  margin-bottom: 16px;
}

.modal-actions {
  display: flex; gap: 8px;
  justify-content: flex-end;
  margin-top: 20px;
}

.flow-list-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  cursor: pointer;
  transition: all 0.12s;
}

.flow-list-item:hover {
  border-color: var(--accent-cyan);
  background: var(--bg-elevated);
}

.flow-list-item-name {
  color: var(--text-bright);
  font-weight: 500;
}

.flow-list-item-meta {
  font-size: 11px;
  color: var(--text-dim);
}

.status-badge {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 500;
}

.status-badge.draft { background: var(--bg-elevated); color: var(--text-dim); border: 1px solid var(--border); }
.status-badge.active { background: rgba(76,223,139,0.15); color: var(--accent-green); }
.status-badge.archived { background: rgba(240,75,92,0.15); color: var(--accent-red); }

.execution-overlay {
  position: absolute; bottom: 12px; left: 12px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 12px;
  z-index: 15;
  min-width: 200px;
}

.execution-overlay .exec-title {
  color: var(--text-white);
  font-weight: 600;
  margin-bottom: 4px;
  display: flex; align-items: center; justify-content: space-between;
}

.exec-close-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 14px;
  cursor: pointer;
  padding: 0 6px;
  border-radius: var(--radius-sm);
  line-height: 1.4;
  transition: all 0.15s;
}

.exec-close-btn:hover {
  background: var(--bg-input);
  color: var(--text-bright);
}

.execution-overlay .exec-progress {
  display: flex; align-items: center; gap: 6px;
  color: var(--accent-cyan);
  font-family: var(--font-mono);
}

.execution-overlay .exec-progress-bar {
  flex: 1; height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.execution-overlay .exec-progress-fill {
  height: 100%;
  background: var(--accent-cyan);
  border-radius: 2px;
  transition: width 0.3s;
}
</style>
</head>
<body>
<div id="root">
  <div class="loading-screen">
    <div class="spinner"></div>
    <div class="text">正在加载流程编辑器...</div>
  </div>
</div>

<script type="text/babel">
const { useState, useCallback, useRef, useEffect, useMemo, createContext, useContext } = React;
const RF = window.ReactFlow || {};
const {
  ReactFlow: FlowCanvas,
  Controls,
  MiniMap,
  Background,
  useNodesState,
  useEdgesState,
  addEdge,
  Panel,
  Handle,
  Position,
  MarkerType,
  ReactFlowProvider,
  useReactFlow,
} = RF;

const API_BASE = '/api/automations';
const IDLE_EXEC_STATUS = Object.freeze({
  status: 'idle',
  currentStep: 0,
  totalSteps: 0,
  executionId: null,
  currentStepId: null,
  latestAiCheck: null,
  latestAiAssist: null,
  aiSummary: null,
  healingCount: 0,
});

const STEP_TYPE_META = {
  click: {
    label: '点击', icon: '⊙', color: '#4b8bf0', bg: 'rgba(75,139,240,0.15)', category: '输入',
    description: '模拟鼠标点击操作，支持左键/右键单击和双击',
    params: {
      button: { type: 'enum', default: 'left', options: ['left', 'right', 'middle'], desc: '鼠标按键类型' },
      clicks: { type: 'number', default: 1, desc: '点击次数，1=单击，2=双击' },
      interval: { type: 'number', default: 0, desc: '连击间隔时间(ms)' },
    },
    usage: '用于按钮点击、菜单选择等常规UI交互。配置目标定位策略可精确定位点击位置。',
  },
  type: {
    label: '输入文本', icon: '⌨', color: '#39c5cf', bg: 'rgba(57,197,207,0.15)', category: '输入',
    description: '模拟键盘输入文本内容，支持清空已输入和逐字输入延迟',
    params: {
      text: { type: 'string', default: '', desc: '要输入的文本内容' },
      interval: { type: 'number', default: 0.05, desc: '每个字符输入间隔(秒)' },
      clear_first: { type: 'boolean', default: false, desc: '输入前是否清空已有内容' },
    },
    usage: '用于表单填写、搜索框输入、聊天消息等文本输入场景。',
  },
  scroll: {
    label: '滚动', icon: '⇅', color: '#9b6bf0', bg: 'rgba(155,107,240,0.15)', category: '输入',
    description: '模拟鼠标滚轮或触控板滚动操作',
    params: {
      direction: { type: 'enum', default: 'down', options: ['up', 'down'], desc: '滚动方向' },
      amount: { type: 'number', default: 3, desc: '滚动量(滚轮刻数)' },
      step_px: { type: 'number', default: 120, desc: '每刻对应像素' },
    },
    usage: '用于页面翻页、列表浏览、无限滚动加载等场景。',
  },
  hotkey: {
    label: '快捷键', icon: '⌃', color: '#d97706', bg: 'rgba(217,119,6,0.15)', category: '输入',
    description: '发送组合键快捷键，支持修饰键组合',
    params: {
      keys: { type: 'array', default: [], desc: '主键列表，如["c","v"]' },
      modifiers: { type: 'array', default: [], desc: '修饰键，如["ctrl","shift","alt","cmd"]' },
    },
    usage: '用于复制粘贴(Ctrl+C/V)、保存(Ctrl+S)、截图等系统快捷键操作。',
  },
  drag: {
    label: '拖拽', icon: '↗', color: '#db2777', bg: 'rgba(219,39,119,0.15)', category: '输入',
    description: '模拟鼠标拖拽操作，从起点拖动到终点',
    params: {
      end_x: { type: 'number', default: 0, desc: '终点X坐标' },
      end_y: { type: 'number', default: 0, desc: '终点Y坐标' },
      duration: { type: 'number', default: 0.5, desc: '拖拽持续时间(秒)' },
      button: { type: 'enum', default: 'left', options: ['left'], desc: '拖拽所用按键' },
    },
    usage: '用于文件移动、区域选择、滑块调节等拖拽操作。',
  },
  wait: {
    label: '等待', icon: '⏳', color: '#8b95a5', bg: 'rgba(139,149,165,0.15)', category: '控制',
    description: '暂停流程执行指定时间，等待页面加载或动画完成',
    params: {
      duration_ms: { type: 'number', default: 3000, desc: '等待时长(毫秒)' },
    },
    usage: '用于等待页面加载完成、动画过渡效果、API响应返回等需延迟场景。',
  },
  condition: {
    label: '条件判断', icon: '◇', color: '#d97706', bg: 'rgba(217,119,6,0.15)', category: '控制',
    description: '根据条件表达式判断流程分支走向',
    params: {
      expression: { type: 'string', default: '', desc: '条件表达式，如"${count}>5"或"元素存在"' },
      true_branch: { type: 'string', default: '', desc: '条件为真时跳转的节点ID' },
      false_branch: { type: 'string', default: '', desc: '条件为假时跳转的节点ID' },
    },
    usage: '用于流程分支控制，如检查登录状态、判断查询结果、验证数据等。',
  },
  loop: {
    label: '循环', icon: '↻', color: '#7c3aed', bg: 'rgba(124,58,237,0.15)', category: '控制',
    description: '重复执行指定步骤集合，支持次数和条件控制',
    params: {
      max_iterations: { type: 'number', default: 10, desc: '最大循环次数' },
      condition: { type: 'string', default: '', desc: '循环终止条件' },
      loop_step_ids: { type: 'array', default: [], desc: '循环体内的步骤ID列表' },
    },
    usage: '用于批量处理数据行、重复网络请求直到成功、分页遍历等场景。',
  },
  switch_window: {
    label: '切换窗口', icon: '⊞', color: '#16a34a', bg: 'rgba(22,163,74,0.15)', category: '窗口',
    description: '切换当前焦点窗口，支持按标题匹配',
    params: {
      title_pattern: { type: 'string', default: '', desc: '窗口标题匹配模式(支持正则)' },
      wait_for_appear: { type: 'boolean', default: true, desc: '是否等待窗口出现' },
    },
    usage: '用于多窗口应用切换、弹窗处理、应用间跳转等。',
  },
  navigate: {
    label: '导航', icon: '🌐', color: '#0891b2', bg: 'rgba(8,145,178,0.15)', category: 'Web',
    description: '浏览器页面导航，打开指定URL',
    params: {
      url: { type: 'string', default: '', desc: '目标URL地址' },

const STEP_CATEGORIES = ['输入', '控制', '窗口', 'Web', '文件'];
const STEP_TYPES_BY_CATEGORY = {};
Object.entries(STEP_TYPE_META).forEach(([type, meta]) => {
  if (!STEP_TYPES_BY_CATEGORY[meta.category]) STEP_TYPES_BY_CATEGORY[meta.category] = [];
  STEP_TYPES_BY_CATEGORY[meta.category].push(type);
});

function generateId() {
  return 'step_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

function generateFlowId() {
  return 'flow_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

function createStepData(type) {
  const meta = STEP_TYPE_META[type] || {};
  const defaultActions = {
    click: { button: 'left', clicks: 1, interval: 0 },
    type: { text: '', interval: 0.05, clear_first: false },
    scroll: { direction: 'down', amount: 3, step_px: 120 },
    hotkey: { keys: [], modifiers: [] },
    drag: { end_x: 0, end_y: 0, duration: 0.5, button: 'left' },
    wait: { duration_ms: 3000 },
    condition: { expression: '', true_branch: '', false_branch: '' },
    loop: { max_iterations: 10, condition: '' },
    switch_window: { title_pattern: '', wait_for_appear: true },
    navigate: { url: '', wait_strategy: 'load' },
    upload_file: { file_path: '', selector: '' },
    download_file: { url: '', save_path: '' },
    file_op: { operation: 'copy', source: '', destination: '' },
  };
  return {
    id: generateId(),
    type: type,
    action: defaultActions[type] || {},
    target: { strategy: 'position' },
    atomic: true,
    depends_on: [],
    preconditions: [],
    branches: [],
    execution_order: null,
    metadata: {},
    delay: type === 'wait' ? 3000 : 500,
    condition: null,
    on_error: 'abort',
    retry_count: 3,
    description: meta.label || type,
    verification_enabled: true,
    verification_strict: false,
  };
}

function createEmptyFlowShell(flowId, name = '新建流程') {

  };
}

function flowToReactFlow(flow) {
  const steps = flow.steps || [];
  const nodes = steps.map((step, index) => {
    const meta = STEP_TYPE_META[step.type] || {};
    return {
      id: step.id,
      type: 'workflowNode',
      position: step.metadata?.position || { x: 250 + (index % 6) * 320, y: 100 + Math.floor(index / 6) * 160 },
      data: {
        label: step.description || meta.label || step.type,
        stepType: step.type,
        color: meta.color || '#8b95a5',
        bgColor: meta.bg || 'rgba(139,149,165,0.15)',
        stepData: {
          ...step,
          ai_analysis: step.ai_analysis || step.metadata?.ai_analysis || null,
        },
        status: 'idle',
      },
    };
  });

  const edges = [];
  (flow.steps || []).forEach(step => {
    (step.branches || []).forEach(branch => {
      edges.push({
        id: `e_${step.id}_${branch.target_step_id}_${branch.outcome || 'default'}`,
        source: step.id,
        target: branch.target_step_id,
        label: branch.outcome && branch.outcome !== 'default' ? branch.outcome : '',
        type: 'smoothstep',
        animated: false,
        style: { stroke: '#d4d3cf', strokeWidth: 1.5 },
        markerEnd: { type: MarkerType.ArrowClosed, color: '#d4d3cf', width: 16, height: 16 },
        data: {
          outcome: branch.outcome || 'default',
          condition: branch.condition || null,
          description: branch.description || '',
          metadata: branch.metadata || {},
        },
      });
    });
  });

  return { nodes, edges };
}

function reactFlowToFlow(flowId, name, nodes, edges, existingFlow) {
  const steps = nodes.map(node => {
    const existingStep = existingFlow?.steps?.find(s => s.id === node.id);
    const nodeStepData = node.data?.stepData || {};
    const base = existingStep ? { ...existingStep } : createStepData(node.data?.stepType || 'click');
    return {
      ...base,
      id: node.id,
      type: node.data?.stepType || base.type || 'click',
      description: node.data?.label || base.description || '',
      action: nodeStepData.action || base.action || {},
      target: nodeStepData.target || base.target || { strategy: 'position' },
      delay: nodeStepData.delay !== undefined ? nodeStepData.delay : base.delay,
      retry_count: nodeStepData.retry_count !== undefined ? nodeStepData.retry_count : base.retry_count,
      verification_enabled: nodeStepData.verification_enabled !== undefined ? nodeStepData.verification_enabled : base.verification_enabled,
      verification_strict: nodeStepData.verification_strict !== undefined ? nodeStepData.verification_strict : base.verification_strict,
      condition: nodeStepData.condition !== undefined ? nodeStepData.condition : base.condition,
      preconditions: nodeStepData.preconditions !== undefined ? nodeStepData.preconditions : (base.preconditions || []),
      on_error: nodeStepData.on_error || base.on_error || 'abort',
      atomic: nodeStepData.atomic !== undefined ? nodeStepData.atomic : base.atomic,
      execution_order: base.execution_order !== null ? base.execution_order : undefined,
      metadata: {
        ...(base.metadata || {}),
        ...(nodeStepData.metadata || {}),
        ...(nodeStepData.ai_analysis ? { ai_analysis: nodeStepData.ai_analysis } : {}),
        position: node.position,
      },
    };
  });

  const stepIds = new Set(steps.map(s => s.id));
  steps.forEach(step => {
    step.branches = [];
    step.depends_on = [];
  });

  edges.forEach(edge => {
    if (!stepIds.has(edge.source) || !stepIds.has(edge.target)) return;
    const sourceStep = steps.find(s => s.id === edge.source);
    const targetStep = steps.find(s => s.id === edge.target);
    if (!sourceStep || !targetStep) return;

    sourceStep.branches.push({
      target_step_id: edge.target,
      outcome: edge.data?.outcome || 'default',
      condition: edge.data?.condition || null,
      description: edge.data?.description || '',
      metadata: edge.data?.metadata || {},
    });

    if (!targetStep.depends_on.includes(edge.source)) {
      targetStep.depends_on.push(edge.source);
    }
  });

  const entryIds = steps.filter(s => !s.depends_on.length).map(s => s.id);

  return {
    id: flowId,
    name: name,
    description: existingFlow?.description || '',
    structure_version: existingFlow?.structure_version || 'atomic-v1',
    entry_step_ids: entryIds.length ? entryIds : (steps.length ? [steps[0].id] : []),
    metadata: existingFlow?.metadata || {},
    steps: steps,
    variables: existingFlow?.variables || [],
    error_handling: existingFlow?.error_handling || {
      default_action: 'abort', max_retries: 3, retry_delay_ms: 1000,
      screenshot_on_error: true, notify_on_error: true,
    },
    confidence: existingFlow?.confidence || 0,
    source_session_id: existingFlow?.source_session_id || null,
    source_pattern: existingFlow?.source_pattern || null,
    behavior_tree: existingFlow?.behavior_tree || null,
    status: existingFlow?.status || 'draft',
    execution_count: existingFlow?.execution_count || 0,
    success_count: existingFlow?.success_count || 0,
  };
}

function NodeLibrary({ searchTerm, onSearchChange, selectedNode }) {
  const filteredCategories = useMemo(() => {
    if (!searchTerm) return STEP_CATEGORIES;
    return STEP_CATEGORIES.filter(cat => {
      const types = STEP_TYPES_BY_CATEGORY[cat] || [];
      return types.some(t => {
        const meta = STEP_TYPE_META[t];
        return (meta.label + t).toLowerCase().includes(searchTerm.toLowerCase());
      });
    });
  }, [searchTerm]);

  const onDragStart = useCallback((event, nodeType) => {
    const stepData = createStepData(nodeType);
    event.dataTransfer.setData('application/reactflow', JSON.stringify({
      nodeType: 'workflowNode',
      stepType: nodeType,
      stepData: stepData,
    }));
    event.dataTransfer.effectAllowed = 'move';
  }, []);

  return (
    <div className="node-library">
      <div className="library-header">
        <span>节点库</span>
      </div>
      <div className="library-search">
        <input
          type="text"
          placeholder="搜索节点类型..."
          value={searchTerm}
          onChange={e => onSearchChange(e.target.value)}
        />
      </div>
      <div className="library-list">
        {filteredCategories.map(category => {
          let types = (STEP_TYPES_BY_CATEGORY[category] || []);
          if (searchTerm) {
            types = types.filter(t => {
              const meta = STEP_TYPE_META[t];
              return (meta.label + t).toLowerCase().includes(searchTerm.toLowerCase());
            });
          }
          if (!types.length) return null;

          return (
            <div key={category} className="library-category">
              <div className="library-category-title">{category}</div>
              {types.map(type => {
                const meta = STEP_TYPE_META[type];
                return (
                  <div
                    key={type}
                    className="library-node"
                    draggable
                    onDragStart={e => onDragStart(e, type)}
                    title={meta.description || ''}
                  >
                    <div className="library-node-dot" style={{ background: meta.color }}></div>
                    <span>{meta.icon}</span>
                    <span>{meta.label}</span>
                  </div>
                );
              })}
            </div>
          );
        })}
        {filteredCategories.length === 0 && (
          <div style={{ padding: '12px', color: 'var(--text-dim)', textAlign: 'center', fontSize: '12px' }}>
            无匹配节点
          </div>
        )}
      </div>

      <div className="property-footer" style={{ padding: '10px 14px', borderTop: '1px solid var(--border)' }}>
        <button
          className="btn btn-sm btn-primary"
          onClick={() => analyzeNodeWithVision(selectedNode)}
          disabled={!selectedNode}
          style={{ width: '100%' }}
        >
          🤖 AI 分析此节点
        </button>
      </div>
    </div>
  );
}

  const stepData = selectedNode.data?.stepData || {};
  const aiAnalysis = stepData.ai_analysis || stepData.metadata?.ai_analysis || null;
  const locatorMeta = stepData.metadata || {};
  const locatorRiskFlags = Array.isArray(locatorMeta.locator_risk_flags) ? locatorMeta.locator_risk_flags : [];
  const locatorRequiresConfirmation = locatorMeta.locator_requires_confirmation === true && locatorMeta.locator_confirmed !== true;
  const meta = STEP_TYPE_META[stepData.type] || {};

  const updateField = (field, value) => {
    const updated = {
      ...selectedNode,
      data: {
        ...selectedNode.data,
        label: field === 'description' ? (value || meta.label || selectedNode.data.stepType) : selectedNode.data.label,
        stepData: { ...stepData, [field]: value },

    onUpdateNode(updated);

        stepData: {

    onUpdateNode(updated);

  const updateMetadata = (updates) => {

      ...selectedNode,
      data: {
        ...selectedNode.data,

          metadata: { ...(stepData.metadata || {}), ...updates },

        <div className="property-group">

function Toast({ toasts, onRemove }) {
  return (
    <div className="toast-container">
      {toasts.map(t => (
        <div
          key={t.id}
          className={`toast toast-${t.type || 'info'}${t.exiting ? ' toast-exit' : ''}`}

          {t.message}
        </div>

function FlowListModal({ onClose, onSelect, onDelete }) {
  const [flows, setFlows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');

  useEffect(() => {
    fetch(API_BASE + '?limit=100')
      .then(r => r.json())
      .then(data => {
        if (Array.isArray(data)) setFlows(data);
        setLoading(false);
      })
      .catch(() => setLoading(false));
  }, []);

  const filteredFlows = useMemo(() => {
    if (!search.trim()) return flows;
    const q = search.toLowerCase();
    return flows.filter(f =>
      f.name.toLowerCase().includes(q) ||
      (f.id || '').toLowerCase().includes(q) ||
      (f.description || '').toLowerCase().includes(q)
    );
  }, [flows, search]);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <h3>打开流程</h3>
        <div style={{ marginBottom: '10px' }}>
          <input
            type="text"
            className="toolbar-flow-name"
            placeholder="🔍 搜索流程名称..."
            value={search}
            onChange={e => setSearch(e.target.value)}
            style={{ width: '100%', padding: '6px 10px' }}
            autoFocus
          />
        </div>
        {loading ? (
          <div style={{ textAlign: 'center', color: 'var(--text-dim)', padding: '20px' }}>加载中...</div>
        ) : filteredFlows.length === 0 ? (
          <div style={{ textAlign: 'center', color: 'var(--text-dim)', padding: '20px' }}>
            {search ? '未找到匹配的流程' : '暂无流程，请先创建新流程'}
          </div>
        ) : (
          filteredFlows.map(flow => (
            <div key={flow.id} className="flow-list-item" onClick={() => onSelect(flow.id)}>
              <div>
                <div className="flow-list-item-name">{flow.name}</div>
                <div className="flow-list-item-meta">
                  {flow.steps?.length || 0} 步骤 · {flow.status || 'draft'}
                </div>
              </div>
              <div style={{ display: 'flex', gap: '6px', alignItems: 'center' }}>
                <span className={`status-badge ${flow.status || 'draft'}`}>
                  {flow.status === 'active' ? '活跃' : flow.status === 'archived' ? '归档' : '草稿'}
                </span>
                <button
                  className="btn btn-sm btn-red"
                  onClick={e => { e.stopPropagation(); onDelete(flow.id); }}
                >
                  删除
                </button>
              </div>
            </div>
          ))
        )}
        <div className="modal-actions">
          <button className="btn" onClick={onClose}>取消</button>
          <button className="btn btn-primary" onClick={() => onSelect('new')}>新建空白流程</button>
        </div>
      </div>
    </div>
  );
}

function ExecutionStatus({ status, currentStep, totalSteps, currentStepId, stepLogs, runtimeAi, onClose }) {
  if (!status || status === 'idle') return null;

  const normalizedLogs = stepLogs || [];
  const stepAttempts = {};
  const logsWithAttempts = normalizedLogs.map((log, index) => {
    const key = log.step_id || `log-${index}`;
    const attempt = (stepAttempts[key] || 0) + 1;
    stepAttempts[key] = attempt;
    return { ...log, attempt };
  });

  const latestByStep = new Map();
  logsWithAttempts.forEach((log, index) => {
    const key = log.step_id || `log-${index}`;
    latestByStep.set(key, log);
  });

  const latestStepLogs = Array.from(latestByStep.values());
  const failedLogs = logsWithAttempts.filter(l => l.status === 'failed');
  const successSteps = latestStepLogs.filter(l => l.status === 'success').length;
  const failedSteps = latestStepLogs.filter(l => l.status === 'failed').length;
  const skippedSteps = latestStepLogs.filter(l => l.status === 'skipped').length;
  const pendingSteps = latestStepLogs.filter(l => l.status === 'pending').length;
  const retryFailures = Math.max(failedLogs.length - failedSteps, 0);
  const latestAssist = runtimeAi?.latestAiAssist;
  const latestCheck = runtimeAi?.latestAiCheck;
  const summary = runtimeAi?.aiSummary;
  const titleText =
    status === 'running' ? '⚡ 执行中'
    : status === 'completed' ? '✅ 执行完成'
    : status === 'partial' ? '⚠️ 部分完成'
    : status === 'failed' ? '❌ 执行失败'
    : status === 'aborted' ? '🛑 已中止'
    : status === 'paused' ? '⏸️ 已暂停'
    : `⏸️ ${status}`;
  const progressColor =
    status === 'failed' ? 'var(--accent-red)'
    : status === 'aborted' ? 'var(--accent-red)'
    : status === 'partial' ? 'var(--accent-amber)'
    : status === 'completed' ? 'var(--accent-green)'
    : 'var(--accent-cyan)';

  return (
    <div className="execution-overlay">
      <div className="exec-title">
        <span>{titleText}</span>
        {onClose && status !== 'running' && status !== 'paused' && (
          <button className="exec-close-btn" onClick={onClose} title="关闭">✕</button>
        )}
      </div>
      <div className="exec-progress">
        <span>{currentStep}/{totalSteps}</span>
        <div className="exec-progress-bar">
          <div className="exec-progress-fill" style={{
            width: totalSteps ? `${(currentStep / totalSteps) * 100}%` : '0%',
            background: progressColor,
          }}></div>
        </div>
      </div>

      {(currentStepId || latestAssist || latestCheck || summary) && (
        <div style={{ marginTop: '8px', borderTop: '1px solid var(--border)', paddingTop: '8px', display: 'grid', gap: '6px' }}>
          {currentStepId && (
            <div style={{ fontSize: '11px', color: 'var(--text-body)' }}>
              当前激活节点：<span style={{ color: 'var(--accent-cyan)', fontFamily: 'var(--font-mono)', fontWeight: '600' }}>{currentStepId}</span>
            </div>
          )}
          {runtimeAi?.healingCount > 0 && (
            <div style={{ fontSize: '11px', color: 'var(--accent-amber)' }}>
              AI 自愈已触发 {runtimeAi.healingCount} 次
            </div>
          )}
          {latestCheck && (
            <div style={{
              fontSize: '11px',
              padding: '6px 8px',
              borderRadius: 'var(--radius-sm)',
              background: latestCheck.level === 'error' ? 'rgba(220,38,38,0.08)' : latestCheck.level === 'warning' ? 'rgba(245,158,11,0.12)' : 'rgba(34,197,94,0.08)',
              borderLeft: `3px solid ${latestCheck.level === 'error' ? 'var(--accent-red)' : latestCheck.level === 'warning' ? 'var(--accent-amber)' : 'var(--accent-green)'}`,
            }}>
              <div style={{ fontWeight: '600', marginBottom: '2px' }}>AI 检查 · {latestCheck.title || '运行检查'}</div>
              <div>{latestCheck.summary || '执行状态正常'}</div>
            </div>
          )}
          {latestAssist && (
            <div style={{
              fontSize: '11px',
              padding: '6px 8px',
              borderRadius: 'var(--radius-sm)',
              background: 'rgba(59,130,246,0.10)',
              borderLeft: '3px solid var(--accent-cyan)',
            }}>
              <div style={{ fontWeight: '600', marginBottom: '2px' }}>{latestAssist.title || 'AI 协同建议'}</div>
              <div>{latestAssist.summary || 'AI 正在协助调整执行。'}</div>
            </div>
          )}
          {summary && (summary.warnings?.length || summary.optimization_items?.length) ? (
            <div style={{
              fontSize: '11px',
              padding: '6px 8px',
              borderRadius: 'var(--radius-sm)',
              background: 'rgba(15,23,42,0.04)',
              border: '1px solid var(--border)',
            }}>
              <div style={{ fontWeight: '600', marginBottom: '4px' }}>流程优化结果</div>
              {summary.warnings?.length > 0 && (
                <div style={{ color: 'var(--accent-amber)', marginBottom: summary.optimization_items?.length ? '4px' : 0 }}>
                  {summary.warnings.slice(0, 2).join('；')}
                </div>
              )}
              {summary.optimization_items?.length > 0 && (
                <div style={{ color: 'var(--text-body)' }}>{summary.optimization_items.slice(0, 2).join('；')}</div>
              )}
            </div>
          ) : null}
        </div>
      )}

      {(status === 'completed' || status === 'partial' || status === 'failed' || status === 'aborted') && (
        <div style={{ marginTop: '8px', borderTop: '1px solid var(--border)', paddingTop: '8px' }}>
          <div style={{ fontSize: '10px', color: 'var(--text-dim)', fontWeight: '600', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '4px' }}>
            执行详情 ({successSteps} 步成功{failedSteps > 0 ? ` · ${failedSteps} 步失败` : ''}{retryFailures > 0 ? ` · ${retryFailures} 次重试失败` : ''}{skippedSteps > 0 ? ` · ${skippedSteps} 步跳过` : ''}{pendingSteps > 0 ? ` · ${pendingSteps} 步未执行` : ''})
          </div>
          {logsWithAttempts.slice(0, 15).map((log, i) => (
            <div key={i} style={{
              fontSize: '10px',
              padding: '3px 6px',
              marginBottom: '2px',
              borderRadius: 'var(--radius-sm)',
              background: log.status === 'failed' ? 'rgba(220,38,38,0.08)' : log.status === 'success' ? 'rgba(22,163,74,0.06)' : log.status === 'skipped' ? 'rgba(245,158,11,0.10)' : 'var(--bg-input)',
              borderLeft: `3px solid ${log.status === 'failed' ? 'var(--accent-red)' : log.status === 'success' ? 'var(--accent-green)' : log.status === 'skipped' ? 'var(--accent-amber)' : 'var(--border)'}`,
              color: log.status === 'failed' ? 'var(--accent-red)' : log.status === 'skipped' ? 'var(--accent-amber)' : 'var(--text-body)',
              fontFamily: 'var(--font-mono)',
              cursor: 'default',
            }} title={log.error || ''}>
              <span style={{ color: 'var(--text-dim)' }}>{i + 1}.</span>{' '}
              {log.step_id ? log.step_id.slice(-12) : '—'}{' '}
              <span style={{ fontWeight: '600' }}>
                {log.status === 'failed' ? '✗' : log.status === 'success' ? '✓' : log.status === 'skipped' ? '↷' : '…'}
              </span>
              {log.attempt > 1 && (
                <span style={{ marginLeft: '6px', color: 'var(--text-dim)' }}>重试 {log.attempt}</span>
              )}
              {log.duration_ms > 0 && (
                <span style={{ marginLeft: '6px', color: 'var(--text-dim)' }}>{log.duration_ms}ms</span>
              )}
              {log.error && (
                <span style={{ display: 'block', marginLeft: '12px', color: 'var(--accent-red)', fontSize: '9px' }}>{log.error.slice(0, 120)}</span>
              )}
            </div>
          ))}
          {logsWithAttempts.length > 15 && (
            <div style={{ fontSize: '9px', color: 'var(--text-dim)', textAlign: 'center' }}>
              ... 还有 {(logsWithAttempts.length - 15)} 条日志
            </div>
          )}
        </div>
      )}
    </div>
  );
}

        `[${log.status?.toUpperCase() || 'PENDING'}] Step ${log.step_index ?? '-'}: ${log.step_type || '-'} - ${log.message || log.error || 'OK'}`
