          React.createElement('div', { style: { fontWeight: 600, marginBottom: '4px' } }, '运行态'),
          React.createElement('div', null, `状态: ${execStatus?.status || 'idle'}`),
          React.createElement('div', null, `当前节点: ${execStatus?.currentStepId || '—'}`),
          React.createElement('div', null, `AI 自愈次数: ${runtimeAi?.healingCount || 0}`)
        ),
        React.createElement('div', { style: { padding: '6px 8px', border: '1px solid var(--border)', borderRadius: '4px', background: 'var(--bg-panel)' } },
          React.createElement('div', { style: { fontWeight: 600, marginBottom: '4px' } }, '最新 AI Check'),
          React.createElement('div', { style: { color: 'var(--text-body)', whiteSpace: 'pre-wrap' } }, runtimeAi?.latestAiCheck?.summary || '暂无')
        ),
        React.createElement('div', { style: { padding: '6px 8px', border: '1px solid var(--border)', borderRadius: '4px', background: 'var(--bg-panel)' } },
          React.createElement('div', { style: { fontWeight: 600, marginBottom: '4px' } }, '最新 AI Assist'),
          React.createElement('div', { style: { color: 'var(--text-body)', whiteSpace: 'pre-wrap' } }, runtimeAi?.latestAiAssist?.summary || '暂无')
        ),
        React.createElement('div', { style: { padding: '6px 8px', border: '1px solid var(--border)', borderRadius: '4px', background: 'var(--bg-panel)' } },
          React.createElement('div', { style: { fontWeight: 600, marginBottom: '4px' } }, '流程优化'),
          React.createElement('div', { style: { color: 'var(--text-body)', whiteSpace: 'pre-wrap' } }, runtimeAi?.aiSummary?.optimization_items?.join('\n') || runtimeAi?.aiSummary?.warnings?.join('\n') || '执行完成后显示')
        )
      ),
      activeTab === 'vars' && (Object.keys(variables || {}).length > 0
        ? Object.entries(variables || {}).map(([k, v]) => React.createElement('div', { key: k, style: { padding: '2px 4px' } },
            React.createElement('span', { style: { color: 'var(--accent-cyan)' } }, k), ' = ', React.createElement('span', { style: { color: 'var(--accent-green)' } }, JSON.stringify(v))
          ))
        : React.createElement('div', { style: { color: 'var(--text-dim)', padding: '8px' } }, '暂无变量。执行流程后变量将在此显示。')
      ),
      activeTab === 'breakpoints' && ((breakpoints || []).length > 0
        ? breakpoints.map((bp, i) => React.createElement('div', { key: i, style: { padding: '4px', display: 'flex', alignItems: 'center', gap: '8px' } },
            React.createElement('span', { style: { color: 'var(--accent-amber)' } }, '🔴'),
            React.createElement('span', null, `Breakpoint at step: ${bp}`),
            React.createElement('button', { onClick: () => onBreakpointToggle(bp), style: { marginLeft: 'auto', fontSize: '10px', border: '1px solid var(--border)', borderRadius: '3px', padding: '1px 6px', cursor: 'pointer', background: 'var(--bg-elevated)' } }, '移除')
          ))
        : React.createElement('div', { style: { color: 'var(--text-dim)', padding: '8px' } }, '暂无断点。右键点击节点可添加断点。')
      ),
      activeTab === 'preview' && (stepLogs.length > 0
        ? React.createElement('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(120px, 1fr))', gap: '8px' } },
            stepLogs.filter(l => l.screenshot).map((log, i) => React.createElement('div', { key: i, style: { border: '1px solid var(--border)', borderRadius: '4px', overflow: 'hidden', cursor: 'pointer' } },
              React.createElement('img', { src: 'data:image/png;base64,' + log.screenshot, style: { width: '100%', height: '80px', objectFit: 'cover' } }),
              React.createElement('div', { style: { padding: '2px 4px', fontSize: '9px', color: log.status === 'success' ? 'var(--accent-green)' : log.status === 'failed' ? 'var(--accent-red)' : 'var(--text-dim)' } },
                `${log.step_type || '?'} ${log.status === 'success' ? '✓' : log.status === 'failed' ? '✗' : '…'}`
              )
            ))
          )
        : React.createElement('div', { style: { color: 'var(--text-dim)', padding: '8px' } }, '执行流程后，步骤截图将在此预览。')
      )
    )
  );
}

function App() {
  const [nodes, setNodes, onNodesChange] = useNodesState([]);
  const [edges, setEdges, onEdgesChange] = useEdgesState([]);
  const [selectedNodeId, setSelectedNodeId] = useState(null);
  const [selectedEdgeId, setSelectedEdgeId] = useState(null);
  const [flowId, setFlowId] = useState(null);
  const [flowName, setFlowName] = useState('未命名流程');
  const [loadedFlow, setLoadedFlow] = useState(null);
  const [searchTerm, setSearchTerm] = useState('');
  const [toasts, setToasts] = useState([]);
  const [showFlowList, setShowFlowList] = useState(true);
  const [execStatus, setExecStatus] = useState(IDLE_EXEC_STATUS);
  const [saveStatus, setSaveStatus] = useState('idle');
  const [isEditingName, setIsEditingName] = useState(false);
  const [stepLogs, setStepLogs] = useState([]);
  const [debugVisible, setDebugVisible] = useState(false);
  const [breakpoints, setBreakpoints] = useState([]);
  const [watchedVars, setWatchedVars] = useState({});
  const reactFlowInstance = useReactFlow();
  const nameInputRef = useRef(null);
  const savingRef = useRef(false);
  const debounceTimerRef = useRef(null);
  const executionSocketRef = useRef(null);
  const [history, setHistory] = useState([]);
  const [historyIndex, setHistoryIndex] = useState(-1);
  const isUndoRedoRef = useRef(false);
  const renderCountRef = useRef(0);
  const nodesRef = useRef(nodes);
  nodesRef.current = nodes;
  const edgesRef = useRef(edges);
  edgesRef.current = edges;
  const loadedFlowRef = useRef(loadedFlow);
  loadedFlowRef.current = loadedFlow;
  const historyIndexRef = useRef(historyIndex);
  historyIndexRef.current = historyIndex;
  const historyRef = useRef(history);
  historyRef.current = history;
  const isEmbedded = useMemo(() => {
    try { return window.self !== window.top || (new URLSearchParams(window.location.search)).get('embedded') === '1'; }
    catch(e) { return false; }
  }, []);
  const closedLoopAssessment = useMemo(() => {
    return loadedFlow?.closed_loop_assessment || loadedFlow?.metadata?.closed_loop_assessment || null;
  }, [loadedFlow]);
  const closedLoopState = useMemo(() => {
    if (!closedLoopAssessment) {
      return { label: '待评估', className: 'draft', title: '保存并分析后可生成闭环评估' };
    }
    if (closedLoopAssessment.ready) {
      return {
        label: `闭环已认证 · ${Math.round(Number(closedLoopAssessment.score || 0) * 100)}%`,
        className: 'active',
        title: closedLoopAssessment.summary || '流程已通过闭环认证',
      };
    }
    const blockingCount = Number(closedLoopAssessment.metrics?.blocking_issue_count || 0);
    return {
      label: `闭环待修复 · ${blockingCount}`,
      className: 'archived',
      title: closedLoopAssessment.summary || '流程未通过闭环认证',
    };
  }, [closedLoopAssessment]);

  const closeExecutionSocket = useCallback(() => {
    if (executionSocketRef.current) {
      executionSocketRef.current.close();
      executionSocketRef.current = null;
    }
  }, []);

  const resetNodeExecutionState = useCallback(() => {
    setNodes(nds => nds.map(n => ({
      ...n,
      data: {
        ...n.data,
        status: 'idle',
        runtimeLabel: '',
      },
    })));
  }, [setNodes]);

  const setActiveExecutionNode = useCallback((stepId, currentStep, totalSteps, label = '执行中') => {
    setNodes(nds => nds.map(n => {
      if (n.id === stepId) {
        return {
          ...n,
          data: {
            ...n.data,
            status: 'running',
            runtimeLabel: totalSteps ? `${label} ${currentStep}/${totalSteps}` : label,
          },
        };
      }
      if (n.data?.status === 'running') {
        return {
          ...n,
          data: {
            ...n.data,
            status: 'idle',
            runtimeLabel: '',
          },
        };
      }
      return n;
    }));
  }, [setNodes]);

  const setExecutionNodeResult = useCallback((stepId, status) => {
    if (!stepId) return;
    setNodes(nds => nds.map(n => n.id === stepId
      ? {
          ...n,
          data: {
            ...n.data,
            status,
            runtimeLabel: '',
          },
        }
      : n
    ));
  }, [setNodes]);

  useEffect(() => () => closeExecutionSocket(), [closeExecutionSocket]);

  function createNodeFromStepDetail(detail, successMessage = 'AI 已创建节点') {
    if (!detail?.stepData) return;

    setShowFlowList(false);
    const nextFlowId = flowId || loadedFlowRef.current?.id || generateFlowId();
    const preferredFlowName = detail.flowName || '屏幕记忆草稿';
    setFlowId(nextFlowId);
    setFlowName(prev => (!prev || prev === '未命名流程' || prev === '新建流程' ? preferredFlowName : prev));
    setLoadedFlow(prev => prev || createEmptyFlowShell(nextFlowId, preferredFlowName));

    const nextIndex = nodesRef.current.length;
    const position = {
      x: 250 + (nextIndex % 4) * 320,
      y: 100 + Math.floor(nextIndex / 4) * 160,
    };

    const stepData = {
      ...detail.stepData,
      metadata: {
        ...(detail.stepData.metadata || {}),
        position,
      },
    };

    const newNode = {
      id: stepData.id,
      type: 'workflowNode',
      position,
      data: {
        label: detail.label || stepData.description || STEP_TYPE_META[stepData.type]?.label || stepData.type,
        stepType: stepData.type,
        color: STEP_TYPE_META[stepData.type]?.color || '#8b95a5',
        bgColor: STEP_TYPE_META[stepData.type]?.bg || 'rgba(139,149,165,0.15)',
        stepData,
        status: 'idle',
      },
    };

    pushHistory();
    setNodes(nds => [...nds, newNode]);
    setSelectedNodeId(newNode.id);
    addToast(successMessage, 'success');
  }

  async function createNodeFromMemory(memoryItem) {
    if (!memoryItem) return;

    if (!flowId && nodesRef.current.length === 0) {
      await loadFlow('new');
    }

    const stepData = buildStepDataFromMemoryItem(memoryItem);
    createNodeFromStepDetail(
      {
        label: memoryItem.metadata?.focused_label || memoryItem.title || stepData.description,
        stepData,
        flowName: '屏幕记忆草稿',
      },
      '已从屏幕记忆创建草稿节点'
    );
  }

  async function createNodeFromFocusCapture(capture) {
    if (!capture) return;

    if (!flowId && nodesRef.current.length === 0) {
      await loadFlow('new');
    }

    const stepData = buildStepDataFromFocusCapture(capture);
    const suggestionTarget = capture?.node_suggestion?.target || {};
    createNodeFromStepDetail(
      {
        label: suggestionTarget.text_contains || suggestionTarget.title || capture?.focused_label || stepData.description,
        stepData,
        flowName: '焦点录制草稿',
      },
      '已从焦点上下文创建草稿节点'
    );
  }

  if (++renderCountRef.current > 100) {
    return React.createElement('div', { className: 'modal-overlay' },
      React.createElement('div', { className: 'modal' },
        React.createElement('h3', null, '⚠️ 渲染循环检测'),
        React.createElement('p', null, '检测到超过100次连续渲染，可能是无限循环。'),
        React.createElement('p', { style: { color: 'var(--text-dim)', fontSize: '11px' } },
          '请刷新页面或返回主控制台。'),
        React.createElement('button', {
          className: 'btn btn-primary',
          onClick: () => { renderCountRef.current = 0; setShowFlowList(true); setNodes([]); setEdges([]); }
        }, '重置编辑器')
      )
    );
  }

  useEffect(() => {
    if (!isEmbedded) return;
    const handler = (e) => {
      const msg = e.data;
      if (!msg || msg.source !== 'auto-agent-workflow') return;
      if (msg.type === 'loadFlow' && msg.flowId) {
        loadFlow(msg.flowId);
      }
      if (msg.type === 'createNodeFromMemory' && msg.memoryItem) {
        createNodeFromMemory(msg.memoryItem);
      }
      if (msg.type === 'createNodeFromFocusCapture' && msg.capture) {
        createNodeFromFocusCapture(msg.capture);
      }
    };
    window.addEventListener('message', handler);
    return () => window.removeEventListener('message', handler);
  }, [createNodeFromFocusCapture, createNodeFromMemory, isEmbedded, loadFlow]);

  useEffect(() => {
    if (!isEmbedded) return;
    if (flowId && flowName) {
      window.parent.postMessage({
        source: 'auto-agent-workflow',
        type: 'flowChanged',
        flowId: flowId,
        flowName: flowName,
      }, '*');
    }
  }, [flowId, flowName, isEmbedded]);

  useEffect(() => {
    if (isEmbedded && nodes.length === 0) {
      setShowFlowList(true);
    }
  }, [isEmbedded]);

  const selectedNode = useMemo(() => nodes.find(n => n.id === selectedNodeId) || null, [nodes, selectedNodeId]);

  useEffect(() => {
    const handleAiNodeUpdated = (event) => {
      const updatedNode = event.detail;
      if (!updatedNode?.id || !nodesRef.current.some(n => n.id === updatedNode.id)) return;
      pushHistory();
      setNodes(nds => nds.map(n => (n.id === updatedNode.id ? updatedNode : n)));
      setSelectedNodeId(updatedNode.id);
      addToast('AI 分析结果已回写到节点', 'success');
    };

    const handleVisionNodeCreated = (event) => {
      const detail = event.detail;
      if (!detail?.stepData) return;
      createNodeFromStepDetail(detail, 'AI 已从截图创建节点');
    };

    window.addEventListener('ai-node-updated', handleAiNodeUpdated);
    window.addEventListener('vision-node-created', handleVisionNodeCreated);

    return () => {
      window.removeEventListener('ai-node-updated', handleAiNodeUpdated);
      window.removeEventListener('vision-node-created', handleVisionNodeCreated);
    };
  }, [addToast, createNodeFromStepDetail, pushHistory, setNodes]);

  const addToast = useCallback((message, type = 'info') => {
    const id = Date.now();
    setToasts(prev => [...prev.slice(-4), { id, message, type, exiting: false }]);
    setTimeout(() => {
      setToasts(prev => prev.map(t => t.id === id ? { ...t, exiting: true } : t));
      setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 220);
    }, 3000);
  }, []);

  const removeToast = useCallback(id => {
    setToasts(prev => prev.map(t => t.id === id ? { ...t, exiting: true } : t));
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 220);
  }, []);

  const dismissExecStatus = useCallback(() => {
    closeExecutionSocket();
    setExecStatus({ ...IDLE_EXEC_STATUS });
    setStepLogs([]);
    resetNodeExecutionState();
  }, [closeExecutionSocket, resetNodeExecutionState]);

  const pushHistory = useCallback(() => {
    if (isUndoRedoRef.current) { isUndoRedoRef.current = false; return; }
    setHistory(prev => {
      const entry = { nodes: JSON.parse(JSON.stringify(nodesRef.current)), edges: JSON.parse(JSON.stringify(edgesRef.current)) };
      const next = prev.slice(0, historyIndexRef.current + 1);
      next.push(entry);
      if (next.length > 50) next.shift();
      return next;
    });
    setHistoryIndex(prev => {
      historyIndexRef.current = prev + 1;
      return prev + 1;
    });
  }, []);

  const undo = useCallback(() => {
    if (historyIndexRef.current < 0) return;
    if (historyIndexRef.current === 0 && historyRef.current.length <= 1) { clearCanvas(); return; }
    isUndoRedoRef.current = true;
    const targetIndex = historyIndexRef.current > 0 ? historyIndexRef.current : 0;
    const entry = historyRef.current[targetIndex] || historyRef.current[historyIndexRef.current];
    if (!entry) return;
    setNodes(entry.nodes || []);
    setEdges(entry.edges || []);
    setHistoryIndex(prev => {
      historyIndexRef.current = Math.max(-1, prev - 1);
      return historyIndexRef.current;
    });
    addToast('已撤销', 'info');
  }, [setNodes, setEdges, addToast]);

  const redo = useCallback(() => {
    if (historyIndexRef.current + 1 >= historyRef.current.length) return;
    isUndoRedoRef.current = true;
    const entry = historyRef.current[historyIndexRef.current + 1];
    if (!entry) return;
    setNodes(entry.nodes || []);
    setEdges(entry.edges || []);
    setHistoryIndex(prev => {
      historyIndexRef.current = prev + 1;
      return historyIndexRef.current;
    });
    addToast('已重做', 'info');
  }, [setNodes, setEdges, addToast]);

  const clearCanvas = useCallback(() => {
    setNodes([]);
    setEdges([]);
    setSelectedNodeId(null);
    setSelectedEdgeId(null);
    setHistory([]);
    setHistoryIndex(-1);
  }, [setNodes, setEdges]);

  const styledEdges = useMemo(() => {
    return edges.map(e => ({
      ...e,
      style: e.id === selectedEdgeId
        ? { stroke: '#d97706', strokeWidth: 3 }
        : { stroke: 'var(--border)', strokeWidth: 2 },
    }));
  }, [edges, selectedEdgeId]);

  const buildFlow = useCallback(() => {
    return reactFlowToFlow(
      flowId || generateFlowId(),
      flowName || '未命名流程',
      nodes,
      edges,
      loadedFlowRef.current
    );
  }, [nodes, edges, flowId, flowName, loadedFlow]);

  const loadFlow = useCallback(async (id) => {
    closeExecutionSocket();
    if (id === 'new') {
      const draftFlow = createEmptyFlowShell(generateFlowId(), '新建流程');
      setNodes([]);
      setEdges([]);
      setFlowId(draftFlow.id);
      setFlowName(draftFlow.name);
      setLoadedFlow(draftFlow);
      setSelectedNodeId(null);
      setShowFlowList(false);
      setExecStatus({ ...IDLE_EXEC_STATUS });
      setStepLogs([]);
      setHistory([]);
      setHistoryIndex(-1);
      addToast('已创建空白流程', 'success');
      return;
    }

    try {
      const resp = await fetch(`${API_BASE}/${id}`);
      if (!resp.ok) throw new Error('加载失败');
      const flow = await resp.json();
      const { nodes: loadedNodes, edges: loadedEdges } = flowToReactFlow(flow);

      setNodes(loadedNodes);
      setEdges(loadedEdges);
      setFlowId(flow.id);
      setFlowName(flow.name);
      setLoadedFlow(flow);
      setSelectedNodeId(null);
      setShowFlowList(false);
      setExecStatus({ ...IDLE_EXEC_STATUS });
      setStepLogs([]);
      setHistory([]);
      setHistoryIndex(-1);
      addToast(`已加载流程: ${flow.name}`, 'success');
    } catch (e) {
      addToast('加载流程失败: ' + e.message, 'error');
    }
  }, [addToast, closeExecutionSocket, setEdges, setNodes]);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const loadId = params.get('load');
    if (loadId && loadId !== 'new') {
      loadFlow(loadId);
    }
  }, [loadFlow]);

  const saveFlow = useCallback(async () => {
    if (savingRef.current) return;
    savingRef.current = true;
    setSaveStatus('saving');

    const flow = buildFlow();

    try {
      let resp;
      const existingResp = await fetch(`${API_BASE}/${flow.id}`);
      if (existingResp.ok) {
        resp = await fetch(`${API_BASE}/${flow.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(flow),
        });
      } else {
        resp = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(flow),
        });
      }

      if (!resp.ok) throw new Error('保存失败');
      const saved = await resp.json();
      if (!flowId || flowId !== saved.id) {
        setFlowId(saved.id);
      }
      setLoadedFlow(saved);
      setSaveStatus('saved');
      addToast('流程已保存', 'success');
      setTimeout(() => { setSaveStatus('idle'); savingRef.current = false; }, 2000);
    } catch (e) {
      setSaveStatus('idle');
      savingRef.current = false;
      addToast('保存失败: ' + e.message, 'error');
    }
  }, [buildFlow, flowId, addToast]);

  const executeFlow = useCallback(async (dryRun = false) => {
    const flow = buildFlow();
    const startTime = Date.now();

    try {
      let resp;
      if (!flow.id) {
        resp = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(flow),
        });
      } else {
        resp = await fetch(`${API_BASE}/${flow.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(flow),
        });
      }
      if (!resp.ok) throw new Error('保存失败');

      const saved = await resp.json();
      const execFlowId = saved.id || flow.id;
      setFlowId(execFlowId);
      setLoadedFlow(saved);
      closeExecutionSocket();
      setStepLogs([]);
      setWatchedVars({});
      resetNodeExecutionState();

      const aiOptions = {
        enabled: true,
        check_enabled: true,
        assist_enabled: true,
        summary_enabled: true,
        mode: 'smart',
      };
      const requestBody = {
        variables: {},
        ai_options: aiOptions,
      };

      const normalizeStepStatus = (value) => {
        const raw = String(value || '').toLowerCase();
        if (raw === 'success' || raw === 'completed') return 'success';
        if (raw === 'failed' || raw === 'error') return 'failed';
        if (raw === 'skipped') return 'skipped';
        if (raw === 'pending') return 'pending';
        if (raw === 'paused') return 'paused';
        return 'running';
      };

      const normalizeFinalStatus = (value, failedSteps = 0) => {
        const raw = String(value || '').toLowerCase();
        if (raw === 'completed') return failedSteps > 0 ? 'partial' : 'completed';
        if (raw === 'failed' || raw === 'aborted' || raw === 'paused' || raw === 'running' || raw === 'partial') return raw;
        return failedSteps > 0 ? 'partial' : 'completed';
      };

      const appendRuntimeLog = (entry) => {
        setStepLogs(prev => [...prev, entry].slice(-150));
      };

      const applyFinalRecord = (record) => {
        const totalSteps = record?.total_steps || flow.steps.length;
        const finalStatus = normalizeFinalStatus(record?.status, record?.failed_steps || 0);
        const rawLogs = Array.isArray(record?.step_logs) ? record.step_logs : [];
        const attemptsByStep = {};
        const normalizedLogs = rawLogs.map((log, index) => {
          const stepKey = log.step_id || `step-${index}`;
          const attempt = (attemptsByStep[stepKey] || 0) + 1;
          attemptsByStep[stepKey] = attempt;
          return {
            step_id: log.step_id || '',
            step_index: typeof log.step_index === 'number' ? log.step_index : index,
            step_type: log.step_type || '',
            status: normalizeStepStatus(log.status),
            error: log.error || log.error_message || '',
            message: log.message || log.error || '',
            duration_ms: log.duration_ms || 0,
            timestamp: log.timestamp || new Date().toISOString(),
            attempt,
            output: log.output || null,
            screenshot: log.screenshot_after || log.screenshot_before || null,
          };
        });

        if (normalizedLogs.length > 0) {
          setStepLogs(normalizedLogs);
        }

        const finalStatusByStep = new Map();
        normalizedLogs.forEach(log => {
          if (log.step_id && ['success', 'failed', 'skipped'].includes(log.status)) {
            finalStatusByStep.set(log.step_id, log.status);
          }
        });
        setNodes(nds => nds.map(n => ({
          ...n,
          data: {
            ...n.data,
            status: finalStatusByStep.get(n.id) || 'idle',
            runtimeLabel: '',
          },
        })));

        setExecStatus(prev => ({
          ...prev,
          status: finalStatus,
          currentStep: record?.completed_steps || totalSteps,
          totalSteps,
          currentStepId: null,
          aiSummary: record?.ai_summary || prev.aiSummary || null,
        }));
        setWatchedVars(record?.variables || {});

        addToast(
          finalStatus === 'completed'
            ? `流程执行完成 (${totalSteps} 步骤, ${Date.now() - startTime}ms)`
            : finalStatus === 'partial'
              ? `流程部分完成 (${record?.failed_steps || 0}/${totalSteps} 步失败)`
            : finalStatus === 'aborted'
              ? `流程已中止 (${record?.failed_steps || 0}/${totalSteps} 失败)`
              : `流程执行结束: ${record?.failed_steps || 0}/${totalSteps} 失败`,
          finalStatus === 'completed' ? 'success' : finalStatus === 'partial' ? 'info' : 'error'
        );
      };

      if (dryRun) {
        const dryRunResp = await fetch(`${API_BASE}/${execFlowId}/dry-run`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody),
        });
        if (!dryRunResp.ok) {
          const errData = await dryRunResp.json().catch(() => ({}));
          const detail = errData?.detail;
          const message = typeof detail === 'string'
            ? detail
            : detail?.message || errData?.message || '执行失败';
          const error = new Error(message);
          error.detail = detail;
          throw error;
        }
        applyFinalRecord(await dryRunResp.json());
        return;
      }

      setExecStatus({
        ...IDLE_EXEC_STATUS,
        status: 'running',
        totalSteps: flow.steps.length,
      });

      const execResp = await fetch(`${API_BASE}/${execFlowId}/execute?async_exec=true`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody),
      });
      if (!execResp.ok) {
        const errData = await execResp.json().catch(() => ({}));
        const detail = errData?.detail;
        const message = typeof detail === 'string'
          ? detail
          : detail?.message || errData?.message || '执行失败';
        const error = new Error(message);
        error.detail = detail;
        throw error;
      }

      const { execution_id: executionId } = await execResp.json();
      if (!executionId) {
        throw new Error('未返回 execution_id');
      }

      setExecStatus(prev => ({ ...prev, executionId: executionId }));

      const wsProtocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
      const wsUrl = `${wsProtocol}://${window.location.host}/api/executions/${executionId}/feedback`;

      await new Promise((resolve, reject) => {
        let settled = false;
        const socket = new WebSocket(wsUrl);
        executionSocketRef.current = socket;

        const finish = (error) => {
          if (settled) return;
          settled = true;
          if (executionSocketRef.current === socket) {
            executionSocketRef.current = null;
          }
          if (error) reject(error);
          else resolve();
        };

        socket.onmessage = (event) => {
          const data = JSON.parse(event.data);
          if (data.type === 'subscribed' || data.type === 'heartbeat') return;
          if (data.type === 'completed') {
            socket.close();
            finish();
            return;
          }

          const stepStatus = String(data.step_status || '').toLowerCase();
          const normalizedStatus = normalizeStepStatus(stepStatus);
          const stepId = data.step_id || null;
          const isHealing = data.ai_assist?.phase === 'self_healing' || String(data.step_description || '').startsWith('AI 自愈尝试');

          appendRuntimeLog({
            step_id: stepId || '',
            step_index: typeof data.current_step === 'number' ? data.current_step - 1 : null,
            step_type: data.step_type || '',
            status: normalizedStatus,
            error: data.error || '',
            message: data.step_description || '',
            duration_ms: data.elapsed_ms || 0,
            timestamp: new Date().toISOString(),
            ai_check: data.ai_check || null,
            ai_assist: data.ai_assist || null,
          });

          if (stepId) {
            if (normalizedStatus === 'running') {
              setActiveExecutionNode(
                stepId,
                data.current_step || 0,
                data.total_steps || flow.steps.length,
                isHealing ? '自愈中' : '执行中'
              );
              setSelectedNodeId(stepId);
            } else if (['success', 'failed', 'skipped'].includes(normalizedStatus)) {
              setExecutionNodeResult(stepId, normalizedStatus);
            } else if (stepStatus === 'paused') {
              setActiveExecutionNode(stepId, data.current_step || 0, data.total_steps || flow.steps.length, '等待处理');
            }
          }

          setExecStatus(prev => ({
            ...prev,
            status: stepStatus === 'failed'
              ? 'failed'
              : stepStatus === 'paused'
                ? 'paused'
                : prev.status === 'failed'
                  ? prev.status
                  : 'running',
            currentStep: data.current_step || prev.currentStep,
            totalSteps: data.total_steps || prev.totalSteps,
            currentStepId: stepId || prev.currentStepId,
            latestAiCheck: data.ai_check || prev.latestAiCheck,
            latestAiAssist: data.ai_assist || prev.latestAiAssist,
            healingCount: prev.healingCount + (isHealing ? 1 : 0),
          }));
        };

        socket.onerror = () => finish(new Error('执行反馈连接失败'));
        socket.onclose = () => finish();
      });

      const finalResp = await fetch(`/api/executions/${executionId}`);
      if (!finalResp.ok) {
        throw new Error('无法读取执行结果');
      }
      applyFinalRecord(await finalResp.json());
    } catch (e) {
      closeExecutionSocket();
      const assessment = e?.detail?.assessment;
      if (assessment) {
        setLoadedFlow(prev => prev ? ({
          ...prev,
          closed_loop_assessment: assessment,
          metadata: {
            ...(prev.metadata || {}),
            closed_loop_assessment: assessment,
            closed_loop_ready: !!assessment.ready,
          },
        }) : prev);
      }
      setStepLogs([{
        step_id: '—',
        status: 'failed',
        error: e.message || 'Unknown error',
        message: e.message || 'Unknown error',
        duration_ms: Date.now() - startTime,
        timestamp: new Date().toISOString(),
        attempt: 1,
        output: null,
      }]);
      setExecStatus(prev => ({
        ...prev,
        status: 'failed',
      }));
      if (assessment?.summary) {
        addToast(assessment.summary, 'warning');
      }
      addToast('执行失败: ' + e.message, 'error');
    }
  }, [addToast, buildFlow, closeExecutionSocket, resetNodeExecutionState, setActiveExecutionNode, setExecutionNodeResult]);

  const onConnect = useCallback((params) => {
    pushHistory();
    setEdges(eds => addEdge({
      ...params,
      type: 'smoothstep',
      style: { stroke: '#d4d3cf', strokeWidth: 1.5 },
      markerEnd: { type: MarkerType.ArrowClosed, color: '#d4d3cf', width: 16, height: 16 },
      data: { outcome: 'default' },
    }, eds));
  }, [setEdges]);

  const onDragOver = useCallback((event) => {
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
  }, []);

  const onDrop = useCallback((event) => {
    event.preventDefault();
    try {
      const raw = event.dataTransfer.getData('application/reactflow');
      const data = JSON.parse(raw);
      if (!data) return;

      const position = reactFlowInstance.screenToFlowPosition({
        x: event.clientX,
        y: event.clientY,
      });

      const stepData = data.stepData || createStepData(data.stepType || 'click');
      stepData.metadata = stepData.metadata || {};
      stepData.metadata.position = position;

      const newNode = {
        id: stepData.id || generateId(),
        type: 'workflowNode',
        position,
        data: {
          label: stepData.description || STEP_TYPE_META[data.stepType]?.label || data.stepType,
          stepType: data.stepType,
          color: STEP_TYPE_META[data.stepType]?.color || '#8b95a5',
          bgColor: STEP_TYPE_META[data.stepType]?.bg || 'rgba(139,149,165,0.15)',
          stepData: stepData,
          status: 'idle',
        },
      };

      pushHistory();
      setNodes(nds => [...nds, newNode]);
    } catch (e) {
      console.error('Drop error:', e);
    }
  }, [reactFlowInstance, setNodes, pushHistory]);

  const onDelete = useCallback(() => {
    if (selectedNodeId) {
      pushHistory();
      setNodes(nds => nds.filter(n => n.id !== selectedNodeId));
      setEdges(eds => eds.filter(e => e.source !== selectedNodeId && e.target !== selectedNodeId));
      setSelectedNodeId(null);
    }
  }, [selectedNodeId, setNodes, setEdges, pushHistory]);

  const onDeleteEdge = useCallback((edgeId) => {
    pushHistory();
    setEdges(eds => eds.filter(e => e.id !== edgeId));
  }, [setEdges, pushHistory]);

  const onPaneClick = useCallback(() => {
    setSelectedNodeId(null);
    setSelectedEdgeId(null);
  }, []);

  const onNodeClick = useCallback((event, node) => {
    setSelectedNodeId(node.id);
    setSelectedEdgeId(null);
  }, []);

  const onEdgeClick = useCallback((event, edge) => {
    event.stopPropagation();
    setSelectedNodeId(null);
    setSelectedEdgeId(edge.id);
  }, []);

  const onUpdateNode = useCallback((updatedNode) => {
    setNodes(nds => nds.map(n => {
      if (n.id === updatedNode.id) return updatedNode;
      return n;
    }));
  }, [setNodes]);

  const handleKeyDown = useCallback((event) => {
    if ((event.ctrlKey || event.metaKey) && event.key === 'z') {
      event.preventDefault();
      if (event.shiftKey) { redo(); } else { undo(); }
      return;
    }
    if (event.key === 'Delete' || event.key === 'Backspace') {
      if (document.activeElement !== document.body) return;
      if (selectedEdgeId) {
        onDeleteEdge(selectedEdgeId);
        setSelectedEdgeId(null);
      } else if (selectedNodeId) {
        onDelete();
      }
    }
    if ((event.ctrlKey || event.metaKey) && event.key === 's') {
      event.preventDefault();
      saveFlow();
    }
  }, [onDelete, saveFlow, selectedNodeId, selectedEdgeId, onDeleteEdge, undo, redo]);

  const handleKeyDownRef = useRef(handleKeyDown);
  handleKeyDownRef.current = handleKeyDown;

  useEffect(() => {
    const handler = (e) => handleKeyDownRef.current(e);
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, []);

  useEffect(() => {
    if (nodes.length === 0 || isUndoRedoRef.current) return;
    if (debounceTimerRef.current) clearTimeout(debounceTimerRef.current);
    debounceTimerRef.current = setTimeout(() => {
      if (savingRef.current || nodes.length === 0) return;
      saveFlow();
    }, 5000);
    return () => { if (debounceTimerRef.current) clearTimeout(debounceTimerRef.current); };
  }, [nodes, edges]);

  useEffect(() => {
    if (isEditingName && nameInputRef.current) {
      nameInputRef.current.focus();
      nameInputRef.current.select();
    }
  }, [isEditingName]);

  const defaultEdgeOptions = useMemo(() => ({
    type: 'smoothstep',
    style: { stroke: '#d4d3cf', strokeWidth: 1.5 },
    markerEnd: { type: MarkerType.ArrowClosed, color: '#d4d3cf', width: 16, height: 16 },
  }), []);

  const nodeTypes = useMemo(() => ({ workflowNode: WorkflowNode }), []);

  if (showFlowList) {
    return (
      <div className="modal-overlay">
        <FlowListModal
          onClose={() => setShowFlowList(false)}
          onSelect={loadFlow}
          onDelete={async (id) => {
            try {
              await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
              addToast('流程已删除', 'success');
              if (flowId === id) {
                setNodes([]);
                setEdges([]);
                setFlowId(generateFlowId());
                setFlowName('新建流程');
                setLoadedFlow(null);
                setSelectedNodeId(null);
                setHistory([]);
                setHistoryIndex(-1);
              }
              setShowFlowList(false);
              setTimeout(() => setShowFlowList(true), 100);
            } catch (e) {
              addToast('删除失败: ' + e.message, 'error');
            }
          }}
        />
      </div>
    );
  }

  return (
    <div className="app-container">
      <div className="toolbar">
        <span className="toolbar-title">FLOW</span>

        {!isEmbedded && (
          <a href="/" className="btn btn-sm" title="返回主控制台" style={{ textDecoration: 'none' }}>
            ← 控制台
          </a>
        )}
        {isEmbedded && <div className="toolbar-divider"></div>}

        {isEditingName ? (
          <input
            ref={nameInputRef}
            className="toolbar-flow-name"
            value={flowName}
            onChange={e => setFlowName(e.target.value)}
            onBlur={() => setIsEditingName(false)}
            onKeyDown={e => {
              if (e.key === 'Enter') setIsEditingName(false);
              if (e.key === 'Escape') { setFlowName(flowName); setIsEditingName(false); }
            }}
            style={{ width: '300px' }}
          />
        ) : (
          <span
            className="toolbar-flow-name"
            onClick={() => setIsEditingName(true)}
            title="点击编辑流程名称"
          >
            {flowName}
          </span>
        )}
        <span className={`status-badge ${closedLoopState.className}`} title={closedLoopState.title}>
          {closedLoopState.label}
        </span>

        <div className="toolbar-divider"></div>

        <div className="toolbar-group">
          <button className="btn btn-sm" onClick={() => handleCreateFromScreenshot()} title="上传截图自动创建操作节点">
            📸 从截图创建
          </button>
        </div>

        <div className="toolbar-divider"></div>

        <div className="toolbar-group">
          <button className="btn btn-sm" onClick={() => setShowFlowList(true)} title="打开/新建流程">
            📂 打开
          </button>
          <button
            className={`btn btn-sm ${saveStatus === 'saving' ? '' : 'btn-primary'}`}
            onClick={saveFlow}
            disabled={saveStatus === 'saving'}
            title="Ctrl+S"
          >
            {saveStatus === 'saving' ? '⏳ 保存中' : saveStatus === 'saved' ? '✅ 已保存' : '💾 保存'}
          </button>
        </div>

        <div className="toolbar-divider"></div>

        <div className="toolbar-group">
          <button className="btn btn-sm btn-green" onClick={() => executeFlow(false)} title="AI 协同执行流程">
            ▶ AI协同执行
          </button>
          <button className="btn btn-sm" onClick={() => executeFlow(true)} title="AI 协同预演（不实际操作）">
            ◉ AI预演
          </button>
        </div>

        <div className="toolbar-divider"></div>

        <div className="toolbar-group">
          <button className="btn btn-sm" onClick={async () => {
            const flow = buildFlow();
            try {
              const resp = await fetch(`${API_BASE}/${flow.id}/export?format=json`, { method: 'POST' });
              const data = await resp.json();
              const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url; a.download = `${flowName || 'flow'}.json`;
              a.click();
              URL.revokeObjectURL(url);
              addToast('已导出JSON', 'success');
            } catch (e) {
              addToast('导出失败: ' + e.message, 'error');
            }
          }}>📥 导出</button>
          <button className="toolbar-btn" onClick={() => setDebugVisible(!debugVisible)} style={{ background: debugVisible ? 'var(--accent-cyan)' : undefined, color: debugVisible ? 'white' : undefined }}>🐛 调试</button>
        </div>

        <div className="toolbar-spacer"></div>

        <div className="toolbar-group">
          <span style={{ fontSize: '11px', color: 'var(--text-dim)' }}>
            {nodes.length} 节点 · {edges.length} 连线
          </span>
        </div>

        {selectedNodeId && (
          <>
            <div className="toolbar-divider"></div>
            <button className="btn btn-sm btn-red" onClick={onDelete} title="Delete 键删除节点">
              🗑 删除节点
            </button>
          </>
        )}
      </div>

      <div className="workspace">
        <NodeLibrary
          searchTerm={searchTerm}
          onSearchChange={setSearchTerm}
          selectedNode={selectedNode}
        />

        <div className="canvas-area">
          <FlowCanvas
            nodes={nodes}
            edges={styledEdges}
            onNodesChange={onNodesChange}
            onEdgesChange={onEdgesChange}
            onConnect={onConnect}
            onDragOver={onDragOver}
            onDrop={onDrop}
            onNodeClick={onNodeClick}
            onEdgeClick={onEdgeClick}
            onPaneClick={onPaneClick}
            nodeTypes={nodeTypes}
            fitView
            deleteKeyCode={['Delete', 'Backspace']}
            multiSelectionKeyCode="Shift"
            defaultEdgeOptions={defaultEdgeOptions}
            snapToGrid={true}
            snapGrid={[20, 20]}
          >
            <Background color="#e8e7e3" gap={20} size={1} />
            <Controls position="bottom-right" />
            <MiniMap
              position="bottom-left"
              style={{ background: '#ffffff', border: '1px solid #e8e7e3' }}
              nodeColor={(node) => node.data?.color || '#9b9b9b'}
              maskColor="rgba(0,0,0,0.04)"
            />
          </FlowCanvas>

          <ExecutionStatus
            status={execStatus.status}
            currentStep={execStatus.currentStep}
            totalSteps={execStatus.totalSteps}
            currentStepId={execStatus.currentStepId}
            stepLogs={stepLogs}
            runtimeAi={execStatus}
            onClose={dismissExecStatus}
          />
        </div>

        <PropertyPanel
          selectedNode={selectedNode}
          onUpdateNode={onUpdateNode}
          nodes={nodes}
        />
      </div>

      {debugVisible && React.createElement(DebugPanel, {
        stepLogs: stepLogs,
        execStatus: execStatus,
        runtimeAi: execStatus,
        variables: watchedVars,
        breakpoints: breakpoints,
        onBreakpointToggle: (stepId) => setBreakpoints(prev => prev.includes(stepId) ? prev.filter(b => b !== stepId) : [...prev, stepId]),
      })}

      <Toast toasts={toasts} onRemove={removeToast} />
    </div>
  );
}

function Root() {
  return (
    <ReactFlowProvider>
      <App />
    </ReactFlowProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root />);

const API_ROOT = window.location.origin + '/api';

function ensureImageDataUrl(imageValue) {
  if (!imageValue) return '';
  return imageValue.startsWith('data:') ? imageValue : `data:image/png;base64,${imageValue}`;
}

function getImageSize(imageValue) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve({
      width: img.naturalWidth || img.width,
      height: img.naturalHeight || img.height,
    });
    img.onerror = () => reject(new Error('无法解析截图尺寸'));
    img.src = ensureImageDataUrl(imageValue);
  });
}

function mapVisionActionToStepType(action) {
  switch ((action || '').toLowerCase()) {
    case 'type':
      return 'type';
    case 'scroll':
      return 'scroll';
    case 'navigate':
      return 'navigate';
    case 'wait':
      return 'wait';
    default:
      return 'click';
  }
}

function inferMemoryStepType(memoryItem) {
  const opType = (memoryItem?.operation_type || '').toLowerCase();
  const focusedRole = (memoryItem?.metadata?.focused_role || '').toLowerCase();

  if (opType === 'navigation') return 'navigate';
  if (opType === 'key_input') return 'type';
  if (opType === 'mouse_scroll') return 'scroll';
  if (opType === 'mouse_drag') return 'drag';
  if (focusedRole.includes('textbox') || focusedRole.includes('input')) return 'type';
  if (memoryItem?.kind === 'snapshot' && memoryItem?.url && !memoryItem?.metadata?.focused_label) return 'navigate';
  return 'click';
}

function buildStepDataFromMemoryItem(memoryItem) {
  const stepType = inferMemoryStepType(memoryItem);
  const base = createStepData(stepType);
  const focusedLabel = memoryItem?.metadata?.focused_label || memoryItem?.title || null;

  const stepData = {
    ...base,
    description: memoryItem?.kind === 'snapshot'
      ? (focusedLabel ? `根据屏幕记忆操作 ${focusedLabel}` : (memoryItem?.title || base.description))
      : (memoryItem?.title || base.description),
    target: {
      ...(base.target || {}),
      strategy: 'text_match',
      title: focusedLabel,
      text_contains: focusedLabel || memoryItem?.window_title || memoryItem?.title || null,
      selector: memoryItem?.metadata?.focused_selector || null,
      xpath: memoryItem?.metadata?.focused_xpath || null,
      url: memoryItem?.url || null,
      bounds: memoryItem?.metadata?.focused_bounds || null,
    },
    metadata: {
      ...(base.metadata || {}),
      memory_source: 'timeline',
      memory_item_id: memoryItem?.id || null,
      memory_kind: memoryItem?.kind || null,
      memory_timestamp: memoryItem?.timestamp || null,
      memory_summary: memoryItem?.summary || '',
      memory_score: memoryItem?.score || 0,
      memory_preview_url: memoryItem?.preview_url || null,
      memory_session_id: memoryItem?.session_id || null,
      memory_url: memoryItem?.url || null,
    },
  };

  if (stepType === 'navigate' && memoryItem?.url) {
    stepData.action = {
      ...(base.action || {}),
      url: memoryItem.url,
      wait_strategy: 'load',
    };
  }

  if (stepType === 'type') {
    stepData.action = {
      ...(base.action || {}),
      text: memoryItem?.metadata?.input_text || '',
      clear_first: false,
    };
  }

  if (stepType === 'scroll') {
    const direction = (memoryItem?.metadata?.mouse_action || '').includes('up') ? 'up' : 'down';
    stepData.action = {
      ...(base.action || {}),
      direction,
    };
  }

  return applyLocatorSafety(stepData, {
    confidence: Number(memoryItem?.score || 0),
    confidenceReason: '时间线记忆节点默认缺少稳定定位器，建议执行前先确认目标元素。',
  });
}

function normalizeCaptureStepType(stepType) {
  return STEP_TYPE_META[stepType] ? stepType : 'click';
}

function deriveLocatorSafety(target, options = {}) {
  const strategy = String(target?.strategy || 'position').toLowerCase();
  const confidence = Number(options.confidence || 0);
  const reason = String(options.confidenceReason || '').trim();
  const riskFlags = Array.isArray(options.riskFlags) ? options.riskFlags.filter(Boolean) : [];
  const hasStableLocator = Boolean(target?.accessibility_id || target?.selector || target?.xpath);
  const hasTextHint = Boolean(String(target?.text_contains || target?.title || '').trim());

  let stability = hasStableLocator ? 'high' : (strategy === 'text_match' && hasTextHint ? 'medium' : 'low');
  let requiresConfirmation = false;

  if (!hasStableLocator) {
    if (strategy === 'position' || strategy === 'image_match') {
      requiresConfirmation = true;
    } else if (strategy === 'text_match') {
      requiresConfirmation = confidence < 0.82 || riskFlags.length > 0 || !hasTextHint;
    }
  }

  if (requiresConfirmation) {
    stability = 'low';
  }

  return {
    confidence,
    confidenceReason: reason,
    riskFlags,
    stability,
    requiresConfirmation,
    confirmed: !requiresConfirmation,
  };
}

function applyLocatorSafety(stepData, options = {}) {
  if (!stepData) return stepData;

  const existingMeta = stepData.metadata || {};
  const existingConfirmed = existingMeta.locator_confirmed === true;
  const safety = deriveLocatorSafety(stepData.target || {}, options);

  stepData.metadata = {
    ...existingMeta,
    locator_confidence: safety.confidence,
    locator_confidence_reason: safety.confidenceReason || existingMeta.locator_confidence_reason || '',
    locator_risk_flags: safety.riskFlags.length > 0 ? safety.riskFlags : (existingMeta.locator_risk_flags || []),
    locator_stability: existingConfirmed ? 'confirmed' : safety.stability,
    locator_requires_confirmation: existingConfirmed ? false : safety.requiresConfirmation,
    locator_confirmed: existingConfirmed ? true : safety.confirmed,
    locator_strategy: (stepData.target || {}).strategy || 'position',
  };

  if (!existingConfirmed && safety.requiresConfirmation) {
    stepData.on_error = 'ask_user';
    stepData.retry_count = 0;
  }

  return stepData;
}

function buildStepDataFromFocusCapture(capture) {
  const suggestion = capture?.node_suggestion || {};
  const target = suggestion.target || {};
  const vision = capture?.vision || {};
  const visionElement = target.vision_element || (vision.actionable_elements || [])[0] || null;
  const stepType = normalizeCaptureStepType(suggestion.step_type || 'click');
  const base = createStepData(stepType);
  const targetLabel = target.text_contains || target.title || visionElement?.label || capture?.focused_label || null;
  const mergedTarget = {
    ...(base.target || {}),
    strategy: target.strategy || base.target?.strategy || 'position',
    accessibility_id: target.accessibility_id || null,
    title: target.title || targetLabel,
    text_contains: target.text_contains || targetLabel,
    role: target.role || visionElement?.element_type || null,
    class_name: target.class_name || null,
    selector: target.selector || null,
    xpath: target.xpath || null,
    url: target.url || null,
    frame: target.frame || null,
    position: target.position || null,
    window_title: target.window_title || vision.window_title || capture?.window_label || null,
    bounds: target.bounds || visionElement?.bounds || null,
  };

  const stepData = {
    ...base,
    description: suggestion.description || targetLabel || vision.user_intent || base.description,
    target: mergedTarget,
    metadata: {
      ...(base.metadata || {}),
      focus_capture_source: 'focus_context',
      focus_capture_session_id: capture?.session_id || null,
      focus_capture_snapshot_id: capture?.snapshot_id || null,
      focus_capture_window_label: capture?.window_label || '',
      focus_capture_focused_label: capture?.focused_label || '',
      focus_capture_summary: capture?.focus_summary || '',
      focus_capture_guidance: capture?.recording_guidance || '',
      focus_capture_vision_source: vision?.source || null,
      focus_capture_vision_confidence: vision?.confidence || 0,
      focus_capture_node_confidence: suggestion?.confidence || 0,
      focus_capture_preconditions: suggestion?.preconditions || [],
      focus_capture_postconditions: suggestion?.postconditions || [],
      focus_capture_variables: suggestion?.variables || [],
      focus_capture_risk_flags: suggestion?.risk_flags || [],
      focus_capture_target: target,
      focus_capture_ocr_preview: capture?.ocr?.text_preview || '',
    },
    ai_analysis: {
      ui_state: vision?.ui_state_description || capture?.focus_summary || '',
      intent: vision?.user_intent || '',
      confidence: Number.isFinite(Number(vision?.confidence)) ? Number(vision.confidence) : 0,
      suggested_next_actions: vision?.suggested_next_actions || [],
      risk: (suggestion?.risk_flags || [])[0] || '',
      timestamp: Date.now(),
    },
  };

  if (stepType === 'type') {
    stepData.action = {
      ...(base.action || {}),
      text: '',
      clear_first: false,
    };
  }

  if (stepType === 'navigate' && mergedTarget.url) {
    stepData.action = {
      ...(base.action || {}),
      url: mergedTarget.url,
      wait_strategy: 'load',
    };
  }

  return applyLocatorSafety(stepData, {
    confidence: Number(suggestion?.confidence || 0),
    confidenceReason: suggestion?.confidence_reason || '',
    riskFlags: suggestion?.risk_flags || [],
  });
}

function normalizeVisionBBox(bbox, imageSize) {
  if (!Array.isArray(bbox) || bbox.length < 4 || !imageSize?.width || !imageSize?.height) {
    return null;
  }

  const [centerX, centerY, width, height] = bbox.map(value => Number(value));
  if ([centerX, centerY, width, height].some(value => Number.isNaN(value))) {
    return null;
  }

  const px = Math.round((centerX / 1000) * imageSize.width);
  const py = Math.round((centerY / 1000) * imageSize.height);
  const pixelWidth = Math.max(1, Math.round((width / 1000) * imageSize.width));
  const pixelHeight = Math.max(1, Math.round((height / 1000) * imageSize.height));

  return {
    position: { x: px, y: py },
    bounds: {
      x: Math.max(0, Math.round(px - pixelWidth / 2)),
      y: Math.max(0, Math.round(py - pixelHeight / 2)),
      width: pixelWidth,
      height: pixelHeight,
    },
  };
}

function handleCreateFromScreenshot() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const base64 = ev.target.result.split(',')[1];
      try {
        const imageSize = await getImageSize(base64).catch(() => null);
        const res = await fetch(API_ROOT + '/vision/analyze-screenshot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image_base64: base64 }),
        });
        if (!res.ok) { alert('Vision analysis failed: ' + res.status); return; }
        const data = await res.json();
        const elements = data.actionable_elements || [];
        if (elements.length > 0) {
          const el = elements.sort((a, b) => (b.confidence || 0) - (a.confidence || 0))[0];
          const stepType = mapVisionActionToStepType(el.suggested_action);
          const bestTarget = normalizeVisionBBox(el.bbox, imageSize);
          const stepData = {
            ...createStepData(stepType),
            description: el.label || data.user_intent || STEP_TYPE_META[stepType]?.label || stepType,
            screenshot: base64,
            target: {
              ...(createStepData(stepType).target || {}),
              strategy: bestTarget ? 'position' : 'text_match',
              position: bestTarget?.position || null,
              bounds: bestTarget?.bounds || null,
              title: el.label || null,
              text_contains: el.label || null,
            },
            metadata: {
              vision_source: 'uploaded_screenshot',
              ai_confidence: el.confidence || data.confidence || 0,
            },
            ai_analysis: {
              ui_state: data.ui_state_description || '',
              intent: data.user_intent || '',
              suggested_next_actions: data.suggested_next_actions || [],
              timestamp: Date.now(),
            },
          };

          applyLocatorSafety(stepData, {
            confidence: Number(el.confidence || data.confidence || 0),
            confidenceReason: '截图识别节点依赖视觉推断，建议执行前先确认目标元素。',
          });

          window.dispatchEvent(new CustomEvent('vision-node-created', {
            detail: {
              label: el.label || el.element_type,
              stepData,
            },
          }));
          showToast('AI 已从截图识别 ' + elements.length + ' 个元素，并创建节点', 'success');
        } else {
          alert('No actionable elements found in screenshot');
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

async function analyzeNodeWithVision(node) {
  if (!node) {
    alert('请先选择一个节点。');
    return;
  }

  const stepData = node.data?.stepData || {};
  const screenshot = stepData.screenshot || node.data?.screenshotBase64;
  if (!screenshot) {
    alert('此节点没有关联的截图。请先从截图创建节点。');
    return;
  }
  try {
    const imageSize = await getImageSize(screenshot).catch(() => null);
    const res = await fetch(API_ROOT + '/vision/analyze-screenshot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image_base64: screenshot, task_description: stepData.description || '' }),
    });
    if (!res.ok) { alert('Analysis failed: ' + res.status); return; }
    const data = await res.json();

    const elements = data.actionable_elements || [];
    let bestEl = null;
    if (elements.length > 0) {
      bestEl = elements.sort((a, b) => (b.confidence || 0) - (a.confidence || 0))[0];
    }

    const updatedStepData = {
      ...stepData,
      ai_analysis: {
        ui_state: data.ui_state_description || '',
        intent: data.user_intent || '',
        confidence: data.confidence || 0,
        suggested_next_actions: data.suggested_next_actions || [],
        timestamp: Date.now(),
      },
    };

    if (bestEl) {
      const bestTarget = normalizeVisionBBox(bestEl.bbox, imageSize);
      updatedStepData.action = {
        ...(stepData.action || {}),
      };

      updatedStepData.target = {
        ...(stepData.target || {}),
        strategy: bestTarget ? 'position' : ((stepData.target || {}).strategy || 'text_match'),
        position: bestTarget?.position || (stepData.target || {}).position || null,
        bounds: bestTarget?.bounds || (stepData.target || {}).bounds || null,
        title: bestEl.label || (stepData.target || {}).title || null,
        text_contains: bestEl.label || (stepData.target || {}).text_contains || null,
        expected_attributes: {
          ...((stepData.target || {}).expected_attributes || {}),
          ai_label: bestEl.label || '',
          ai_element_type: bestEl.element_type || '',
        },
      };

      if (bestEl.label) {
        updatedStepData.description = bestEl.label;
      }

      updatedStepData.metadata = {
        ...(stepData.metadata || {}),
        ai_confidence: bestEl.confidence || 0,
        ai_suggested_action: bestEl.suggested_action || '',
      }
    }

    applyLocatorSafety(updatedStepData, {
      confidence: Number(bestEl?.confidence || data.confidence || 0),
      confidenceReason: 'AI 重新分析后的定位仍建议在执行前确认目标元素。',
    });

    const newLabel = bestEl ? (bestEl.label || stepData.type || 'click') : (data.user_intent || 'AI分析后节点');
    const updatedNode = {
      ...node,
      data: {
        ...node.data,
        label: newLabel,
        stepData: updatedStepData,
      },
    };

    window._aiUpdatedNode = updatedNode;
    window.dispatchEvent(new CustomEvent('ai-node-updated', { detail: updatedNode }));
    showToast(`AI分析完成: ${elements.length} 个元素, 最佳匹配: ${bestEl ? (bestEl.label || bestEl.element_type) : 'N/A'}`, 'success');
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

function showToast(message, type) {
  const toast = document.createElement('div');
  toast.style.cssText = `position:fixed;top:20px;right:20px;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;color:#fff;${type==='success'?'background:#10b981':type==='error'?'background:#ef4444':'background:#3b82f6'}`;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}
