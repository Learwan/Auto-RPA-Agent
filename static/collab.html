<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>录制协作室 — Auto Agent Workflow</title>
<link rel="stylesheet" href="/ui-theme.css">
<style>
:root {
  --bg-deep: #f4ede3;
  --bg-panel: rgba(255, 251, 245, 0.9);
  --bg-elevated: #fffdf8;
  --bg-input: #f8efe4;
  --border: rgba(121, 94, 61, 0.18);
  --border-active: rgba(121, 94, 61, 0.32);
  --text-dim: #877868;
  --text-body: #66594c;
  --text-bright: #241d18;
  --text-white: #1f1915;
  --accent-cyan: #c96b2c;
  --accent-green: #2d7b58;
  --accent-red: #b45543;
  --accent-amber: #b9781c;
  --accent-blue: #356c9f;
  --accent-purple: #785fb6;
  --accent-cyan-dim: rgba(201, 107, 44, 0.12);
  --accent-green-dim: rgba(45, 123, 88, 0.14);
  --accent-red-dim: rgba(180, 85, 67, 0.14);
  --glow-cyan: 0 16px 32px rgba(201, 107, 44, 0.18);
  --glow-green: 0 14px 30px rgba(45, 123, 88, 0.16);
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 24px;
  --font-display: 'IBM Plex Mono', 'SF Mono', monospace;
  --font-mono: 'IBM Plex Mono', 'SF Mono', monospace;
  --font-body: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background:
    radial-gradient(circle at top left, rgba(201,107,44,0.18), transparent 24%),
    radial-gradient(circle at top right, rgba(53,108,159,0.08), transparent 20%),
    linear-gradient(180deg, #f8f2ea 0%, var(--bg-deep) 44%, #ece1d1 100%);
  color: var(--text-body);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background: 
    linear-gradient(rgba(121, 94, 61, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(121, 94, 61, 0.05) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none; z-index: 0;
  mask-image: linear-gradient(180deg, rgba(255,255,255,0.38), transparent 100%);
  opacity: 0.24;
}

header {
  background: linear-gradient(180deg, rgba(255, 251, 245, 0.94), rgba(255, 247, 238, 0.86));
  border-bottom: 1px solid var(--border);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  border-radius: 0 0 24px 24px;
  padding: 0 24px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
  flex-shrink: 0;
  box-shadow: 0 16px 42px rgba(103, 73, 37, 0.08);
}

.header-left {
  display: flex; align-items: center; gap: 16px;
}

.logo {
  font-family: var(--font-display);
  font-size: 12px;
  letter-spacing: 0.18em;
  color: var(--accent-cyan);
  text-transform: uppercase;
}

.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 6px;
}

.status-dot.online { background: var(--accent-green); box-shadow: var(--glow-green); }
.status-dot.offline { background: var(--accent-red); box-shadow: 0 0 8px rgba(240,75,92,0.4); }
.status-dot.loading { background: var(--accent-amber); box-shadow: 0 0 8px rgba(240,179,75,0.4); animation: pulse 1s infinite; }

@keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }

.header-status {
  font-size: 11px; color: var(--text-dim);
  display: flex; align-items: center; gap: 14px;
}

.header-status span {
  display: flex; align-items: center; gap: 4px;
}

.header-right {
  display: flex; align-items: center; gap: 12px;
}

.btn {
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 600;
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.58);
  color: var(--text-bright);
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.5px;
}

.btn:hover { border-color: var(--border-active); background: rgba(121, 94, 61, 0.08); }
.btn:active { transform: scale(0.97); }

.btn-primary {
  background: var(--accent-cyan);
  border-color: var(--accent-cyan);
  color: #fffaf4;
  font-weight: 600;
  box-shadow: var(--glow-cyan);
}
.btn-primary:hover { background: #ac581f; }

.btn-ghost { background: transparent; border-color: transparent; color: var(--text-dim); }
.btn-ghost:hover { color: var(--text-bright); background: rgba(121, 94, 61, 0.08); }

.btn-red { border-color: var(--accent-red); color: var(--accent-red); }
.btn-red:hover { background: var(--accent-red-dim); border-color: var(--accent-red); }

main {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative; z-index: 1;
}

.sidebar {
  width: 260px;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.sidebar-section {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}

.sidebar-section h3 {
  font-family: var(--font-display);
  font-size: 10px;
  letter-spacing: 0.16em;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 12px;
}

.user-list {
  list-style: none;
  display: flex; flex-direction: column; gap: 4px;
}

.user-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-bright);
  transition: background 0.15s;
}

.user-item:hover { background: var(--bg-elevated); }

.user-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  color: var(--bg-deep);
  flex-shrink: 0;
}

.ai-section {
  margin-top: auto;
  padding: 16px;
  border-top: 1px solid var(--border);
}

.ai-status-panel {
  background: var(--bg-elevated);
  border-radius: var(--radius);
  padding: 12px;
  border: 1px solid var(--border);
}

.ai-status-panel .label {
  font-size: 10px; color: var(--text-dim);
  letter-spacing: 1px; text-transform: uppercase;
  margin-bottom: 8px;
}

.ai-model-info {
  font-size: 12px; color: var(--accent-cyan);
  font-family: var(--font-mono);
  margin-bottom: 6px;
}

.ai-metrics {
  display: flex; flex-direction: column; gap: 4px;
  font-size: 11px; color: var(--text-dim);
  font-family: var(--font-mono);
}

.ai-metrics span { display: flex; justify-content: space-between; }
.ai-metrics .value { color: var(--text-bright); }

.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  scroll-behavior: smooth;
}

.chat-area::-webkit-scrollbar { width: 5px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.message {
  display: flex; gap: 10px;
  padding: 8px 0;
  animation: msgIn 0.25s ease-out;
}

@keyframes msgIn { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }

.msg-avatar {
  width: 32px; height: 32px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  flex-shrink: 0;
  margin-top: 2px;
}

.msg-body {
  flex: 1; min-width: 0;
}

.msg-header {
  display: flex; align-items: baseline; gap: 8px;
  margin-bottom: 4px;
}

.msg-username {
  font-size: 12px; font-weight: 600;
  color: var(--text-white);
}

.msg-time {
  font-size: 10px; color: var(--text-dim);
  font-family: var(--font-mono);
}

.msg-badge {
  font-size: 9px; padding: 1px 6px;
  border-radius: 10px;
  font-weight: 500;
  letter-spacing: 0.5px;
}

.msg-badge.ai { background: var(--accent-purple); color: #fff; }
.msg-badge.system { background: var(--bg-elevated); color: var(--text-dim); border: 1px solid var(--border); }
.msg-badge.user { background: var(--accent-cyan-dim); color: var(--accent-cyan); }

.msg-content {
  font-size: 13px; color: var(--text-body);
  line-height: 1.65;
  word-break: break-word;
  white-space: pre-wrap;
}

.msg-content code {
  background: var(--bg-input);
  padding: 1px 5px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent-green);
}

.message.system .msg-content { color: var(--text-dim); font-size: 12px; font-style: italic; }
.message.ai .msg-content { color: var(--text-bright); }
.message.ai .msg-avatar { background: linear-gradient(135deg, #6b3fcf, #9b6bf0); color: #fff; }
.message.system .msg-avatar { background: var(--bg-elevated); color: var(--text-dim); border: 1px solid var(--border); }

.chat-input-area {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  background: var(--bg-panel);
  display: flex; gap: 10px;
  align-items: flex-end;
}

.chat-input-row {
  flex: 1;
  display: flex; gap: 8px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
  transition: border-color 0.15s;
}

.chat-input-row:focus-within {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 2px var(--accent-cyan-dim);
}

.chat-input-row textarea {
  flex: 1;
  background: transparent;
  border: 0;
  color: var(--text-bright);
  font-family: var(--font-body);
  font-size: 13px;
  resize: none;
  outline: none;
  line-height: 1.5;
  max-height: 100px;
}

.chat-input-row textarea::placeholder { color: var(--text-dim); }

.input-hints {
  display: flex; gap: 6px;
  align-items: center;
  flex-shrink: 0;
}

.input-hint {
  font-size: 10px; color: var(--text-dim);
  font-family: var(--font-mono);
  padding: 2px 6px;
  border-radius: 3px;
  background: var(--bg-elevated);
  cursor: pointer;
  transition: all 0.15s;
}

.input-hint:hover { color: var(--accent-cyan); background: var(--accent-cyan-dim); }

.recording-panel {
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  width: 340px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
}

.panel-tab {
  flex: 1;
  padding: 10px;
  text-align: center;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  letter-spacing: 0.5px;
}

.panel-tab:hover { color: var(--text-bright); }
.panel-tab.active { color: var(--accent-cyan); border-bottom-color: var(--accent-cyan); }

.panel-content {
  flex: 1; overflow-y: auto; padding: 16px;
}

.panel-content::-webkit-scrollbar { width: 5px; }
.panel-content::-webkit-scrollbar-track { background: transparent; }
.panel-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 40px 20px;
  color: var(--text-dim); text-align: center; gap: 8px;
}

.empty-state .icon { font-size: 32px; opacity: 0.4; }

.streaming-indicator {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent-cyan);
  padding: 8px 12px;
  background: var(--accent-cyan-dim);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  display: none;
}

.streaming-indicator.active { display: block; }

.ai-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 10px;
}

.ai-card .card-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}

.ai-card .card-label {
  font-size: 10px; letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--accent-purple);
  font-weight: 600;
}

.ai-card .card-time {
  font-size: 10px; color: var(--text-dim);
  font-family: var(--font-mono);
}

.ai-card .card-text {
  font-size: 12px; color: var(--text-bright);
  line-height: 1.6;
}

.narrative-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
}

.narrative-card .narrative-title {
  font-size: 13px; font-weight: 600;
  color: var(--text-white);
  margin-bottom: 8px;
}

.narrative-card .narrative-list {
  list-style: none;
  display: flex; flex-direction: column; gap: 4px;
}

.narrative-card .narrative-list li {
  font-size: 12px; color: var(--text-body);
  padding-left: 16px;
  position: relative;
}

.narrative-card .narrative-list li::before {
  content: '›';
  position: absolute; left: 0;
  color: var(--accent-cyan);
  font-weight: 700;
}

.narrative-section { margin-top: 10px; }
.narrative-section .section-label {
  font-size: 10px; color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.narrative-section .risk-item { color: var(--accent-amber); }
.narrative-section .improve-item { color: var(--accent-green); }

.join-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(67, 48, 26, 0.26);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
}

.join-dialog {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 32px;
  width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.join-dialog h2 {
  font-family: var(--font-display);
  font-size: 16px; letter-spacing: 2px;
  color: var(--text-white);
  margin-bottom: 8px;
  text-transform: uppercase;
}

.join-dialog .subtitle {
  font-size: 12px; color: var(--text-dim);
  margin-bottom: 24px;
}

.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 11px; color: var(--text-dim);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.form-group input, .form-group select {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-bright);
  font-family: var(--font-body);
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}
.form-group input:focus, .form-group select:focus {
  border-color: var(--accent-cyan);
}

.form-actions { display: flex; gap: 10px; margin-top: 24px; }
.form-actions .btn { flex: 1; justify-content: center; text-align: center; }

.toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 200;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 18px;
  font-size: 13px;
  color: var(--text-bright);
  box-shadow: 0 18px 44px rgba(103, 73, 37, 0.16);
  animation: toastIn 0.3s ease-out;
  max-width: 350px;
}

@keyframes toastIn { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:translateY(0) } }

@media (max-width: 900px) {
  .sidebar { width: 200px; }
  .recording-panel { width: 280px; }
}
@media (max-width: 700px) {
  .sidebar { display: none; }
  .recording-panel { display: none; }
}
</style>
</head>
<body class="claude-light-theme collab-theme">

<header>
  <div class="header-left">
    <span class="logo">录制协作室</span>
    <div class="header-status">
      <span><span class="status-dot" id="llmDot"></span><span id="llmLabel">LLM 检测中</span></span>
      <span><span class="status-dot" id="wsDot"></span><span id="wsLabel">未连接</span></span>
      <span id="userCount" style="color:var(--text-dim)"></span>
    </div>
  </div>
  <div class="header-right">
    <button class="btn btn-ghost" onclick="togglePanel('analysis')" title="分析面板">分析面板</button>
    <button class="btn btn-ghost" onclick="togglePanel('suggestions')" title="AI 建议">AI 建议</button>
    <button class="btn btn-red" id="btnLeave" onclick="leaveRoom()">退出协作</button>
  </div>
</header>

<main>
  <aside class="sidebar">
    <div class="sidebar-section">
      <h3>在线协作者</h3>
      <ul class="user-list" id="userList">
        <li class="user-item" style="color:var(--text-dim)">等待连接...</li>
      </ul>
    </div>
    <div class="sidebar-section">
      <h3>会话信息</h3>
      <div style="font-size:11px;color:var(--text-dim);font-family:var(--font-mono)">
        <div>房间: <span id="roomIdDisplay" style="color:var(--text-bright)">—</span></div>
        <div>会话: <span id="sessionIdDisplay" style="color:var(--text-bright)">—</span></div>
      </div>
    </div>
    <div class="ai-section">
      <div class="ai-status-panel">
        <div class="label">AI 引擎</div>
        <div class="ai-model-info" id="aiModel">—</div>
        <div class="ai-metrics">
          <span>速度 <span class="value" id="aiSpeed">— tok/s</span></span>
          <span>显存 <span class="value" id="aiVRAM">— MB</span></span>
        </div>
      </div>
    </div>
  </aside>

  <div class="content">
    <div class="chat-area" id="chatArea">
      <div class="empty-state">
        <div class="icon">◈</div>
        <div>连接协作室以开始交流</div>
        <div style="font-size:11px;margin-top:4px">输入 @ai 向 AI 助手提问，使用 / 触发命令</div>
      </div>
    </div>
    <div class="chat-input-area">
      <div class="chat-input-row">
        <textarea id="chatInput" rows="1" placeholder="输入消息... (@ai 提问 AI, /help 帮助)" onkeydown="handleInputKey(event)"></textarea>
        <div class="input-hints">
          <span class="input-hint" onclick="insertHint('@ai ')">@ai</span>
          <span class="input-hint" onclick="insertHint('/analyze')">/analyze</span>
          <span class="input-hint" onclick="insertHint('/help')">/help</span>
        </div>
      </div>
      <button class="btn btn-primary" onclick="sendMessage()">发送</button>
    </div>
  </div>

  <aside class="recording-panel" id="recordingPanel">
    <div class="panel-tabs">
      <div class="panel-tab active" data-tab="analysis" onclick="switchTab('analysis')">AI 分析</div>
      <div class="panel-tab" data-tab="suggestions" onclick="switchTab('suggestions')">智能建议</div>
    </div>
    <div class="panel-content" id="panelContent">
      <div class="empty-state">
        <div class="icon">◈</div>
        <div>录制开始后<br>AI 分析将实时显示</div>
      </div>
    </div>
  </aside>
</main>

<div class="join-overlay" id="joinOverlay">
  <div class="join-dialog">
    <h2>加入录制协作室</h2>
    <p class="subtitle">输入信息以加入实时录制协作会话</p>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="joinUsername" placeholder="输入你的用户名" value="" autofocus>
    </div>
    <div class="form-group">
      <label>房间 ID</label>
      <input type="text" id="joinRoomId" placeholder="协作房间 ID" value="default-room">
    </div>
    <div class="form-group">
      <label>会话 ID</label>
      <input type="text" id="joinSessionId" placeholder="录制会话 ID" value="demo-session">
    </div>
    <div class="form-actions">
      <button class="btn" onclick="closeJoinDialog()">取消</button>
      <button class="btn btn-primary" onclick="joinRoom()">加入协作</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  const state = {
    roomId: '',
    sessionId: '',
    username: '',
    userId: '',
    ws: null,
    connected: false,
    llmReady: false,
    users: [],
    currentTab: 'analysis',
    aiMessages: [],
    suggestions: [],
    narratives: [],
  };

  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);

  const chatArea = $('#chatArea');
  const chatInput = $('#chatInput');
  const joinOverlay = $('#joinOverlay');
  const userList = $('#userList');
  const panelContent = $('#panelContent');

  window.joinRoom = joinRoom;
  window.leaveRoom = leaveRoom;
  window.sendMessage = sendMessage;
  window.handleInputKey = handleInputKey;
  window.insertHint = insertHint;
  window.switchTab = switchTab;
  window.closeJoinDialog = closeJoinDialog;
  window.togglePanel = togglePanel;

  const avatarColors = [
    ['#39c5cf','#1a6b72'], ['#4cdf8b','#1a6b3a'],
    ['#f0b34b','#7a5518'], ['#4b8bf0','#1a3f7a'],
    ['#9b6bf0','#4a2b8a'], ['#f04b5c','#7a1a24'],
    ['#39c5cf','#1a6b72'], ['#4cdf8b','#1a6b3a'],
  ];

  function getAvatarColor(i) {
    return avatarColors[i % avatarColors.length];
  }

  function getInitials(name) {
    return (name || '?').slice(0, 2).toUpperCase();
  }

  function createAvatar(username, index) {
    const [bg, _] = getAvatarColor(index || 0);
    return `<div class="user-avatar" style="background:${bg};color:#0a0e14">${getInitials(username)}</div>`;
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const roomFromUrl = params.get('room');
    const sessionFromUrl = params.get('session');
    const userFromUrl = params.get('user');

    if (roomFromUrl) $('#joinRoomId').value = roomFromUrl;
    if (sessionFromUrl) $('#joinSessionId').value = sessionFromUrl;
    if (userFromUrl) $('#joinUsername').value = userFromUrl;

    await checkLocalLLM();

    if (roomFromUrl && userFromUrl) {
      state.roomId = roomFromUrl;
      state.sessionId = sessionFromUrl || 'default-session';
      state.username = userFromUrl;
      await connectWebSocket();
      return;
    }

    joinOverlay.style.display = 'flex';
    setTimeout(() => $('#joinUsername').focus(), 100);
  }

  async function checkLocalLLM() {
    try {
      const resp = await fetch('/api/collab/local-llm/status');
      const data = await resp.json();
      updateLLMStatus(data);
    } catch (e) {
      updateLLMStatus({ enabled: false, running: false });
    }
  }

  function updateLLMStatus(data) {
    const dot = $('#llmDot');
    const label = $('#llmLabel');
    dot.className = 'status-dot';
    if (!data.enabled) {
      dot.classList.add('offline');
      label.textContent = 'LLM 未启用';
    } else if (data.running && data.model_loaded) {
      dot.classList.add('online');
      const engineLabel = { vllm: 'vLLM', mlx: 'MLX', auto: 'Auto' };
      label.textContent = (engineLabel[data.engine] || data.engine || 'LLM') + ' 就绪';
      state.llmReady = true;
    } else if (data.enabled && !data.running) {
      dot.classList.add('offline');
      label.textContent = 'LLM 离线';
    } else {
      dot.classList.add('loading');
      label.textContent = 'LLM 加载中';
    }

    const engineLabel = { vllm: 'vLLM', mlx: 'MLX', auto: 'Auto' };
    $('#aiModel').textContent = `${engineLabel[data.engine] || data.engine || '—'} · ${data.model || '—'}`;
    $('#aiSpeed').textContent = data.tokens_per_second ? `${data.tokens_per_second} tok/s` : '— tok/s';
    $('#aiVRAM').textContent = data.vram_used_mb ? `${data.vram_used_mb} MB` : '— MB';
    if (data.gpu_name) {
      document.querySelector('#aiModel').title = `GPU: ${data.gpu_name}`;
    }
  }

  async function joinRoom() {
    const username = $('#joinUsername').value.trim();
    const roomId = $('#joinRoomId').value.trim();
    const sessionId = $('#joinSessionId').value.trim();

    if (!username) { showToast('请输入用户名'); return; }
    if (!roomId) { showToast('请输入房间 ID'); return; }
    if (!sessionId) { showToast('请输入会话 ID'); return; }

    state.roomId = roomId;
    state.sessionId = sessionId;
    state.username = username;

    await connectWebSocket();
  }

  async function connectWebSocket() {
    const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const host = window.location.host;
    const wsUrl = `${proto}//${host}/api/collab/ws/${state.roomId}?session_id=${encodeURIComponent(state.sessionId)}&username=${encodeURIComponent(state.username)}`;

    try {
      state.ws = new WebSocket(wsUrl);

      state.ws.onopen = () => {
        state.connected = true;
        joinOverlay.style.display = 'none';
        updateWSStatus(true);
        $('#roomIdDisplay').textContent = state.roomId;
        $('#sessionIdDisplay').textContent = state.sessionId;
        chatInput.focus();
      };

      state.ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          handleWSMessage(msg);
        } catch (e) {
          console.error('WS parse error:', e);
        }
      };

      state.ws.onclose = (event) => {
        state.connected = false;
        updateWSStatus(false);
        if (event.code !== 1000) {
          showToast('连接已断开，正在尝试重连...');
          setTimeout(() => {
            if (!state.connected) connectWebSocket();
          }, 3000);
        }
      };

      state.ws.onerror = () => {
        updateWSStatus(false);
      };

    } catch (e) {
      showToast('连接失败: ' + e.message);
    }
  }

  function updateWSStatus(connected) {
    const dot = $('#wsDot');
    const label = $('#wsLabel');
    dot.className = 'status-dot';
    if (connected) {
      dot.classList.add('online');
      label.textContent = '已连接';
    } else {
      dot.classList.add('offline');
      label.textContent = '未连接';
    }
  }

  function handleWSMessage(msg) {
    switch (msg.type) {
      case 'room_joined':
        state.userId = msg.user_id;
        state.users = msg.users || [];
        renderUserList();
        if (msg.history) renderHistory(msg.history);
        break;

      case 'chat_message':
        appendMessage(msg);
        break;

      case 'users_update':
        state.users = msg.users || [];
        renderUserList();
        $('#userCount').textContent = msg.count ? `${msg.count} 人在线` : '';
        break;

      case 'ai_stream':
        handleAIStream(msg);
        break;

      case 'ai_suggestion':
        state.suggestions.push(msg);
        if (state.currentTab === 'suggestions') renderSuggestions();
        break;

      case 'flow_narrative':
        state.narratives.push(msg);
        if (state.currentTab === 'analysis') renderNarratives();
        break;

      case 'heartbeat':
      case 'pong':
        break;

      case 'error':
        showToast(msg.message || '发生错误');
        break;
    }
  }

  function renderHistory(messages) {
    const hadContent = chatArea.querySelector('.message') !== null;
    if (!hadContent) chatArea.innerHTML = '';

    for (const msg of messages) {
      appendMessage(msg, true);
    }
  }

  function appendMessage(msg, isHistory = false) {
    const firstMsg = chatArea.querySelector('.empty-state');
    if (firstMsg) firstMsg.remove();

    const div = document.createElement('div');
    div.className = `message ${msg.role}`;
    if (!isHistory) div.style.animation = 'msgIn 0.25s ease-out';

    const timeStr = msg.timestamp
      ? new Date(msg.timestamp * 1000).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
      : '';

    let badgeHtml = '';
    if (msg.role === 'ai') badgeHtml = '<span class="msg-badge ai">AI</span>';
    else if (msg.role === 'system') badgeHtml = '<span class="msg-badge system">系统</span>';

    let avatarHtml = '';
    if (msg.role === 'ai') {
      avatarHtml = `<div class="msg-avatar" style="background:linear-gradient(135deg,#6b3fcf,#9b6bf0);color:#fff">AI</div>`;
    } else if (msg.role === 'system') {
      avatarHtml = `<div class="msg-avatar" style="background:var(--bg-elevated);color:var(--text-dim);border:1px solid var(--border)">S</div>`;
    } else {
      const userIndex = state.users.indexOf(msg.username);
      const [bg] = getAvatarColor(userIndex >= 0 ? userIndex : Math.abs(hashStr(msg.username)));
      avatarHtml = `<div class="msg-avatar" style="background:${bg};color:#0a0e14">${getInitials(msg.username)}</div>`;
    }

    div.innerHTML = `
      ${avatarHtml}
      <div class="msg-body">
        <div class="msg-header">
          <span class="msg-username">${escHtml(msg.username)}</span>
          ${badgeHtml}
          <span class="msg-time">${timeStr}</span>
        </div>
        <div class="msg-content">${escHtml(msg.content)}</div>
      </div>
    `;

    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  let streamEl = null;
  let streamContent = '';

  function handleAIStream(msg) {
    if (!msg.message_id) return;

    if (!streamEl || streamEl.dataset.msgId !== msg.message_id) {
      streamContent = '';
      const firstMsg = chatArea.querySelector('.empty-state');
      if (firstMsg) firstMsg.remove();

      streamEl = document.createElement('div');
      streamEl.className = 'message ai';
      streamEl.dataset.msgId = msg.message_id;
      streamEl.innerHTML = `
        <div class="msg-avatar" style="background:linear-gradient(135deg,#6b3fcf,#9b6bf0);color:#fff">AI</div>
        <div class="msg-body">
          <div class="msg-header">
            <span class="msg-username">${escHtml(msg.username || 'AI 分析助手')}</span>
            <span class="msg-badge ai">AI</span>
          </div>
          <div class="msg-content streaming">${streamingCursor()}</div>
        </div>
      `;
      chatArea.appendChild(streamEl);
    }

    if (!msg.is_final && msg.token) {
      streamContent += msg.token;
      const contentEl = streamEl.querySelector('.msg-content');
      if (contentEl) contentEl.innerHTML = escHtml(streamContent) + streamingCursor();
    }

    if (msg.is_final) {
      const contentEl = streamEl.querySelector('.msg-content');
      if (contentEl) {
        contentEl.innerHTML = escHtml(msg.full_response || streamContent);
        contentEl.classList.remove('streaming');
      }
      streamEl = null;
      streamContent = '';
    }

    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function streamingCursor() {
    return '<span style="animation:pulse 0.6s infinite;color:var(--accent-cyan)">▌</span>';
  }

  function sendMessage() {
    if (!state.connected || !state.ws) return;

    const content = chatInput.value.trim();
    if (!content) return;

    let msgType = 'chat';
    if (content.startsWith('@ai')) {
      msgType = 'ai_query';
    } else if (content.startsWith('/')) {
      msgType = 'command';
    }

    state.ws.send(JSON.stringify({
      type: msgType,
      content: content,
    }));

    chatInput.value = '';
    chatInput.style.height = 'auto';
    chatInput.focus();
  }

  function handleInputKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
    autoResize(e.target);
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  function insertHint(text) {
    chatInput.value = text;
    chatInput.focus();
  }

  function renderUserList() {
    if (state.users.length === 0) {
      userList.innerHTML = '<li class="user-item" style="color:var(--text-dim)">暂无用户</li>';
      return;
    }

    userList.innerHTML = state.users.map((u, i) => {
      const [bg] = getAvatarColor(i);
      return `
        <li class="user-item">
          <div class="user-avatar" style="background:${bg};color:#0a0e14">${getInitials(u)}</div>
          ${escHtml(u)}${u === state.username ? ' <span style="color:var(--accent-cyan);font-size:10px">(你)</span>' : ''}
        </li>
      `;
    }).join('');

    $('#userCount').textContent = `${state.users.length} 人在线`;
  }

  function renderNarratives() {
    if (state.narratives.length === 0) {
      panelContent.innerHTML = '<div class="empty-state"><div class="icon">◈</div><div>等待 AI 分析结果...</div></div>';
      return;
    }

    panelContent.innerHTML = state.narratives.map(n => `
      <div class="narrative-card">
        <div class="narrative-title">${escHtml(n.summary)}</div>
        ${n.steps && n.steps.length ? `
        <div class="narrative-section">
          <div class="section-label">操作步骤</div>
          <ol class="narrative-list">
            ${n.steps.map(s => `<li>${escHtml(s)}</li>`).join('')}
          </ol>
        </div>` : ''}
        ${n.risks && n.risks.length ? `
        <div class="narrative-section">
          <div class="section-label">潜在风险</div>
          <ul class="narrative-list">
            ${n.risks.map(r => `<li class="risk-item">${escHtml(r)}</li>`).join('')}
          </ul>
        </div>` : ''}
        ${n.improvements && n.improvements.length ? `
        <div class="narrative-section">
          <div class="section-label">改进建议</div>
          <ul class="narrative-list">
            ${n.improvements.map(i => `<li class="improve-item">${escHtml(i)}</li>`).join('')}
          </ul>
        </div>` : ''}
      </div>
    `).join('');

    panelContent.scrollTop = panelContent.scrollHeight;
  }

  function renderSuggestions() {
    if (state.suggestions.length === 0) {
      panelContent.innerHTML = '<div class="empty-state"><div class="icon">◨</div><div>录制开始后<br>智能建议将显示在此</div></div>';
      return;
    }

    panelContent.innerHTML = state.suggestions.slice().reverse().map(s => `
      <div class="ai-card">
        <div class="card-header">
          <span class="card-label">${escHtml(s.category || '分析')}</span>
          <span class="card-time">${formatTime(s.timestamp)}</span>
        </div>
        <div class="card-text">${escHtml(s.message)}</div>
        ${s.tokens_per_second ? `<div style="font-size:10px;color:var(--text-dim);margin-top:6px;font-family:var(--font-mono)">${s.tokens_per_second} tok/s · ${s.elapsed_ms}ms</div>` : ''}
      </div>
    `).join('');

    panelContent.scrollTop = panelContent.scrollHeight;
  }

  function switchTab(tab) {
    state.currentTab = tab;
    $$('.panel-tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`)?.classList.add('active');

    if (tab === 'analysis') renderNarratives();
    else if (tab === 'suggestions') renderSuggestions();
  }

  function togglePanel(tab) {
    switchTab(tab);
    const panel = $('#recordingPanel');
    if (panel.style.display === 'none') {
      panel.style.display = 'flex';
    }
  }

  function leaveRoom() {
    if (state.ws) {
      state.ws.close(1000, 'user_left');
      state.ws = null;
    }
    state.connected = false;
    state.users = [];
    updateWSStatus(false);
    renderUserList();
    $('#userCount').textContent = '';
    chatArea.innerHTML = '<div class="empty-state"><div class="icon">◈</div><div>已退出协作室</div></div>';
    panelContent.innerHTML = '<div class="empty-state"><div class="icon">◈</div><div>已退出协作室</div></div>';
    state.aiMessages = [];
    state.suggestions = [];
    state.narratives = [];
    joinOverlay.style.display = 'flex';
    $('#joinUsername').focus();
  }

  function closeJoinDialog() {
    if (state.connected) {
      joinOverlay.style.display = 'none';
    }
  }

  function showToast(msg) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);

    setTimeout(() => toast.remove(), 3500);
  }

  function escHtml(s) {
    if (!s) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function hashStr(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) {
      h = ((h << 5) - h) + s.charCodeAt(i);
      h |= 0;
    }
    return Math.abs(h);
  }

  function formatTime(ts) {
    if (!ts) return '';
    return new Date(ts * 1000).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  document.addEventListener('DOMContentLoaded', init);

  window.addEventListener('beforeunload', () => {
    if (state.ws && state.connected) {
      state.ws.close(1000, 'page_unload');
    }
  });

  document.addEventListener('click', (e) => {
    if (e.target === joinOverlay && state.connected) {
      joinOverlay.style.display = 'none';
    }
  });
})();
</script>
</body>
</html>
